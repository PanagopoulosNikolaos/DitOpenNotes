<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Δίκτυο στο Έπακρο - Quiz 3</title>
  
  <!-- MathJax Configuration -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>

  <style>
    /* CSS Variables for Split-Pane Workspace Dark Theme */
    :root {
      --bg-color: #0c0c0e;
      --sidebar-bg: #141417;
      --workspace-bg: #1a1a1e;
      --border-color: #2a2a32;
      --border-focus: #3e3e4a;
      --text-main: #f4f4f7;
      --text-muted: #8e8e9f;
      --accent-color: #8b5cf6;
      --accent-hover: #7c3aed;
      --accent-bg: rgba(139, 92, 246, 0.1);
      --success-color: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --error-color: #ef4444;
      --error-bg: rgba(239, 68, 68, 0.15);
    }

    /* Base body configurations with fluid fonts */
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: clamp(0.9em, 0.8vw + 0.6em, 1.25em);
      line-height: 1.5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    *, *::before, *::after {
      box-sizing: inherit;
    }

    /* Fluid container wrapping the sidebar and workspace */
    .app-workspace {
      display: flex;
      flex-direction: row;
      width: min(95%, 52em);
      height: min(90vh, 38em);
      background-color: var(--workspace-bg);
      border: 0.1em solid var(--border-color);
      border-radius: 1em;
      overflow: hidden;
      box-shadow: 0 1em 3em rgba(0, 0, 0, 0.4);
    }

    /* Left Sidebar Navigation */
    .sidebar {
      width: min(30%, 15em);
      background-color: var(--sidebar-bg);
      border-right: 0.1em solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 1.5em 1.2em;
      flex-shrink: 0;
    }

    .sidebar-title {
      font-size: 0.8em;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 0 0 1.5em 0;
      letter-spacing: 0.08em;
      border-bottom: 0.1em solid var(--border-color);
      padding-bottom: 0.8em;
    }

    .nodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(2.2em, 1fr));
      gap: 0.7em;
      margin: 0;
      padding: 0;
      list-style-type: none;
    }

    /* Interactive node buttons */
    .node-item {
      aspect-ratio: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .node-button {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 0.1em solid var(--border-color);
      background-color: transparent;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.9em;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .node-button:hover:not(:disabled) {
      border-color: var(--accent-color);
      background-color: var(--accent-bg);
    }

    /* Node states representing quiz progress */
    .node-button.active {
      border-color: var(--accent-color);
      background-color: var(--accent-color);
      color: var(--bg-color);
      box-shadow: 0 0 0.8em rgba(139, 92, 246, 0.4);
    }

    .node-button.correct {
      border-color: var(--success-color);
      background-color: var(--success-bg);
      color: var(--success-color);
    }

    .node-button.incorrect {
      border-color: var(--error-color);
      background-color: var(--error-bg);
      color: var(--error-color);
    }

    /* Sidebar footer and navigation slabs */
    .sidebar-footer {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5em;
      padding-top: 1em;
      border-top: 0.1em solid var(--border-color);
    }

    .sidebar-slab-btn {
      width: 100%;
      padding: 0.7em;
      border-radius: 0.4em;
      border: 0.1em solid var(--border-color);
      background-color: rgba(255, 255, 255, 0.02);
      color: var(--text-main);
      font-size: 0.85em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      font-family: inherit;
    }

    .sidebar-slab-btn:hover:not(:disabled) {
      background-color: var(--accent-bg);
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    .sidebar-slab-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .sidebar-slab-btn.active {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
      color: var(--bg-color);
      box-shadow: 0 0 0.8em rgba(139, 92, 246, 0.4);
    }

    /* Right Active Workspace Content Area */
    .workspace-content {
      flex-grow: 1;
      padding: 2em;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background-color: var(--workspace-bg);
    }

    .question-header {
      margin-bottom: 1.2em;
    }

    .topic-badge {
      font-size: 0.75em;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent-color);
      background-color: var(--accent-bg);
      padding: 0.3em 0.8em;
      border-radius: 1em;
      display: inline-block;
      margin-bottom: 0.8em;
    }

    .question-text {
      font-size: clamp(1.1em, 1.8vw + 0.6em, 1.35em);
      font-weight: 500;
      margin: 0;
      line-height: 1.5;
    }

    /* Option inputs styling */
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 0.7em;
      margin-bottom: 1.5em;
    }

    .option-row {
      width: 100%;
      text-align: left;
      padding: 0.9em 1.1em;
      background-color: rgba(255, 255, 255, 0.01);
      border: 0.1em solid var(--border-color);
      border-radius: 0.5em;
      color: var(--text-main);
      font-size: 0.92em;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .option-row:hover:not(:disabled) {
      background-color: rgba(255, 255, 255, 0.03);
      border-color: var(--border-focus);
    }

    .option-row:disabled {
      cursor: not-allowed;
    }

    /* Correctness highlights */
    .option-row.correct {
      background-color: var(--success-bg);
      border-color: var(--success-color);
      color: var(--success-color);
      font-weight: 600;
    }

    .option-row.incorrect {
      background-color: var(--error-bg);
      border-color: var(--error-color);
      color: var(--error-color);
      font-weight: 600;
    }

    .status-badge {
      font-size: 0.8em;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.2em 0.5em;
      border-radius: 0.25em;
      margin-left: 1em;
      flex-shrink: 0;
    }

    .status-badge.correct-badge {
      background-color: var(--success-color);
      color: var(--bg-color);
    }

    .status-badge.incorrect-badge {
      background-color: var(--error-color);
      color: var(--bg-color);
    }

    /* Explanation display panel */
    .explanation-panel {
      padding: 1em;
      background-color: rgba(255, 255, 255, 0.02);
      border-left: 0.2em solid var(--accent-color);
      border-radius: 0.25em;
      margin-bottom: 1.5em;
      display: none;
      font-size: 0.88em;
    }

    .explanation-title {
      font-weight: 600;
      color: var(--text-main);
      margin: 0 0 0.3em 0;
    }

    .explanation-text {
      color: var(--text-muted);
      margin: 0;
    }

    /* Footer section triggers */
    .workspace-footer {
      margin-top: auto;
      display: flex;
      justify-content: flex-end;
      padding-top: 1em;
      border-top: 0.1em solid var(--border-color);
    }

    .btn-primary {
      padding: 0.7em 1.5em;
      background-color: var(--accent-color);
      color: var(--text-main);
      border: none;
      border-radius: 0.4em;
      font-size: 0.92em;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Completed state summaries layout */
    .report-view {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    .report-title {
      font-size: 1.5em;
      font-weight: 700;
      margin: 0 0 1em 0;
    }

    .summary-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5em;
      background-color: rgba(255, 255, 255, 0.01);
      border: 0.1em solid var(--border-color);
      border-radius: 0.6em;
      margin-bottom: 1.5em;
    }

    .score-number {
      font-size: clamp(2.5em, 5vw + 1em, 3.8em);
      font-weight: 800;
      color: var(--accent-color);
      line-height: 1;
      margin-bottom: 0.2em;
    }

    .score-desc {
      font-size: 0.9em;
      color: var(--text-muted);
      text-align: center;
    }

    .click-hint {
      font-size: 0.85em;
      color: var(--accent-color);
      margin-top: 0.8em;
      font-weight: 600;
    }

    .report-controls {
      display: flex;
      gap: 1em;
      justify-content: center;
      margin-top: auto;
    }

    .btn-secondary {
      padding: 0.7em 1.5em;
      background: transparent;
      color: var(--text-main);
      border: 0.1em solid var(--border-color);
      border-radius: 0.4em;
      font-size: 0.92em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.03);
      border-color: var(--border-focus);
    }

    /* Responsive adjustment for small Viewports */
    @media (max-width: 32em) {
      .app-workspace {
        flex-direction: column;
        height: auto;
        min-height: min(90vh, 38em);
      }
      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 0.1em solid var(--border-color);
      }
    }
  </style>
</head>
<body>

  <div class="app-workspace">
    <!-- Left Navigation Sidebar -->
    <div class="sidebar">
      <div class="sidebar-title">Ερωτήσεις</div>
      <ul id="nodes-container" class="nodes-grid">
        <!-- Generates 1-10 circular indicator nodes -->
      </ul>
      <div class="sidebar-footer">
        <button id="home-btn" class="sidebar-slab-btn">Home</button>
        <button id="status-btn" class="sidebar-slab-btn" disabled>Status</button>
      </div>
    </div>

    <!-- Right Content Workspace -->
    <div class="workspace-content">
      <!-- Active Question panel -->
      <div id="quiz-view">
        <div class="question-header">
          <div class="topic-badge">COMPUTER NETWORKS</div>
          <h2 id="question-text" class="question-text">Φόρτωση ερώτησης...</h2>
        </div>

        <div id="options-box" class="options-container">
          <!-- Populated dynamically -->
        </div>

        <div id="explanation-box" class="explanation-panel">
          <div class="explanation-title">Επεξήγηση</div>
          <p id="explanation-text" class="explanation-text"></p>
        </div>

        <div class="workspace-footer">
          <button id="next-button" class="btn-primary">Επόμενο</button>
        </div>
      </div>

      <!-- Final Report View -->
      <div id="report-view" class="report-view">
        <h2 class="report-title">Αξιολόγηση</h2>
        <div class="summary-card">
          <div id="score-display" class="score-number">0 / 0</div>
          <div class="score-desc">Σωστά Απαντημένες Ερωτήσεις</div>
          <div class="click-hint">Κάντε κλικ στα αριστερά νούμερα για αναλυτική επισκόπηση ερώτησης.</div>
        </div>

        <div class="report-controls">
          <button id="shuffle-button" class="btn-secondary">Shuffle</button>
          <button id="retake-button" class="btn-primary">Retake</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Variable casing rules: snake_case, functions: camelCase, classes: PascalCase

    const quiz_questions = [
      {
        question: "Ποιο επίπεδο ISP (Tier) αντιπροσωπεύει τους τοπικούς παρόχους που προσφέρουν τη σύνδεση «τελευταίου μιλίου» προς σπίτια και επιχειρήσεις;",
        options: [
          "Tier 3",
          "Tier 2",
          "Tier 1",
          "Tier 0"
        ],
        correct_index: 0,
        explanation: "Οι Tier 3 ISP παρέχουν την τοπική πρόσβαση στους τελικούς χρήστες (το τελευταίο μίλι). Συνδέονται ιεραρχικά στους Tier 2, οι οποίοι με τη σειρά τους συνδέονται στο Tier 1 backbone."
      },
      {
        question: "Ένας χρήστης κατεβάζει ένα αρχείο μεγέθους $2.5 \\text{ GB}$ μέσω σύνδεσης VDSL με ταχύτητα λήψης $100 \\text{ Mbps}$. Πόσα δευτερόλεπτα απαιτούνται για τη μετάδοση (θεωρώντας $1 \\text{ GB} = 10^9 \\text{ bytes}$);",
        options: [
          "$200 \\text{ sec}$",
          "$25 \\text{ sec}$",
          "$250 \\text{ sec}$",
          "$20 \\text{ sec}$"
        ],
        correct_index: 0,
        explanation: "Μετατρέπουμε το μέγεθος σε bits: $2.5 \\text{ GB} = 2.5 \\times 10^9 \\text{ bytes} \\times 8 = 20 \\times 10^9 \\text{ bits}$. Διαιρούμε με τον ρυθμό $100 \\text{ Mbps} = 100 \\times 10^6 \\text{ bps}$: $T = \\frac{20 \\times 10^9}{100 \\times 10^6} = 200 \\text{ sec}$."
      },
      {
        question: "Τι ορίζει ο όρος NaaS (Network as a Service) στο πλαίσιο του cloud computing;",
        options: [
          "Μοντέλο όπου οι οργανισμοί νοικιάζουν δικτυακές υποδομές και δυνατότητες αντί να αγοράζουν φυσικό εξοπλισμό.",
          "Ένα πρωτόκολλο για τη δωρεάν ανταλλαγή δεδομένων μεταξύ Tier 1 παρόχων.",
          "Μια υπηρεσία για την αυτόματη μετατροπή αναλογικών σημάτων σε ψηφιακά.",
          "Ένα σύστημα ασφαλείας για την κρυπτογράφηση των email."
        ],
        correct_index: 0,
        explanation: "Το NaaS (Network as a Service) επιτρέπει σε εταιρείες να «νοικιάζουν» δικτυακές υποδομές και υπηρεσίες (routing, security, WAN) από παρόχους cloud, αποφεύγοντας το κόστος αγοράς φυσικών routers/switches."
      },
      {
        question: "Ποια είναι η τυπική διάμετρος του γυάλινου πυρήνα (core) μιας οπτικής ίνας απλού τρόπου (Single-mode Fiber);",
        options: [
          "~$9 \\text{ } \\mu\\text{m}$",
          "~$50 \\text{ } \\mu\\text{m}$",
          "~$62.5 \\text{ } \\mu\\text{m}$",
          "~$125 \\text{ } \\mu\\text{m}$"
        ],
        correct_index: 0,
        explanation: "Η οπτική ίνα απλού τρόπου (SMF) έχει εξαιρετικά λεπτό πυρήνα (~9 μm). Αυτό περιορίζει το φως σε μία μόνο δέσμη/τρόπο διάδοσης, εκμηδενίζοντας τις αντανακλάσεις και επιτρέποντας πολύ μεγάλες αποστάσεις."
      },
      {
        question: "Στο μοντέλο Client-Server, χρειάζεται μια εφαρμογή-πελάτης (client) να γνωρίζει τις διευθύνσεις IP των άλλων πελατών;",
        options: [
          "Όχι, οι πελάτες επικοινωνούν μόνο με τον εξυπηρετητή (server) και δεν χρειάζεται να γνωρίζουν ο ένας τον άλλον.",
          "Ναι, για να γίνει η αρχική εύρεση (discovery).",
          "Ναι, διότι η κίνηση δρομολογείται P2P.",
          "Όχι, εκτός αν χρησιμοποιείται IPv6."
        ],
        correct_index: 0,
        explanation: "Στην αρχιτεκτονική client-server, οι clients επικοινωνούν αποκλειστικά με τον server. Μόνο ο server έχει σταθερή και γνωστή διεύθυνση IP, την οποία καλούν όλοι οι clients."
      },
      {
        question: "Ποιες τεχνολογίες χρησιμοποιεί το 5G NR για να κατευθύνει το σήμα προς συγκεκριμένους χρήστες και να εξυπηρετεί πολλούς concurrent χρήστες ανά base station;",
        options: [
          "Massive MIMO και Beamforming.",
          "DSLAM και Active Splitters.",
          "Circuit Switching και Time Division Multiplexing.",
          "Single-mode Lasers και LED."
        ],
        correct_index: 0,
        explanation: "Το 5G NR χρησιμοποιεί Massive MIMO (εκατοντάδες κεραίες στο σταθμό βάσης) και Beamforming (κατεύθυνση της δέσμης σήματος προς το smartphone του χρήστη) για μέγιστη αποδοτικότητα."
      },
      {
        question: "Ποιο πρωτόκολλο χρησιμοποιείται για τη διαχείριση, έναρξη και τερματισμό των κλήσεων (session management) σε συστήματα VoIP;",
        options: [
          "SIP (Session Initiation Protocol)",
          "RTP (Real-time Transport Protocol)",
          "DNS",
          "SMTP"
        ],
        correct_index: 0,
        explanation: "Το SIP (Session Initiation Protocol) είναι υπεύθυνο για την εγκαθίδρυση, τη διαχείριση και τον τερματισμό της κλήσης VoIP, ενώ η μεταφορά των δεδομένων ήχου γίνεται μέσω του RTP."
      },
      {
        question: "Γιατί τα χάλκινα σύρματα στα καλώδια Ethernet είναι συνεστραμμένα σε ζεύγη (twisted pair);",
        options: [
          "Για τη μείωση των ηλεκτρομαγνητικών παρεμβολών και της συνακρόασης (crosstalk).",
          "Για να αυξηθεί η ταχύτητα διάδοσης του ηλεκτρικού σήματος.",
          "Για να χωράνε περισσότερα σύρματα στο ίδιο βύσμα RJ45.",
          "Για να αποφευχθεί το σπάσιμο των αγωγών κατά την κάμψη."
        ],
        correct_index: 0,
        explanation: "Το στρίψιμο των χάλκινων συρμάτων εξουδετερώνει τις ηλεκτρομαγνητικές παρεμβολές από εξωτερικές πηγές καθώς και τη συνακρόαση (crosstalk) μεταξύ γειτονικών ζευγών μέσα στο ίδιο καλώδιο."
      },
      {
        question: "Ποιο είδος οπτικού δικτύου χρησιμοποιεί ενεργό εξοπλισμό (όπως switches) στο δίκτυο διανομής για τη δρομολόγηση του σήματος;",
        options: [
          "AON (Active Optical Network)",
          "PON (Passive Optical Network)",
          "HFC (Hybrid Fiber-Coaxial)",
          "DSL (Digital Subscriber Line)"
        ],
        correct_index: 0,
        explanation: "Το AON (Active Optical Network) χρησιμοποιεί ενεργά switches (που χρειάζονται ρεύμα) στο δίκτυο διανομής για να κατευθύνει τα σήματα φωτός στους χρήστες, σε αντίθεση με το PON που χρησιμοποιεί splitters."
      },
      {
        question: "Ποιο μοντέλο επικοινωνίας επιτρέπει στις συσκευές να λειτουργούν ταυτόχρονα ως πελάτες και ως εξυπηρετητές;",
        options: [
          "Peer-to-Peer (P2P)",
          "Client-Server",
          "Mainframe-Terminal",
          "Master-Slave"
        ],
        correct_index: 0,
        explanation: "Στην αρχιτεκτονική Peer-to-Peer (P2P), δεν υπάρχουν μόνιμοι ρόλοι. Οι συσκευές (peers) επικοινωνούν άμεσα και ενεργούν ταυτόχρονα ως λήπτες (clients) και πάροχοι (servers) δεδομένων."
      }
    ];

    class QuizManager {
      /**
       * Instantiates state elements.
       * Args:
       * questions (Array): Questions array.
       */
      constructor(questions) {
        this.original_order = questions;
        this.questions_list = [];
        this.user_answers = [];
        this.current_index = 0;

        // Workspace layouts
        this.quiz_view = document.getElementById("quiz-view");
        this.report_view = document.getElementById("report-view");
        this.sidebar_grid = document.getElementById("nodes-container");
        this.text_container = document.getElementById("question-text");
        this.options_container = document.getElementById("options-box");
        this.explanation_panel = document.getElementById("explanation-box");
        this.explanation_txt = document.getElementById("explanation-text");
        this.next_btn = document.getElementById("next-button");
        this.score_val = document.getElementById("score-display");
        this.home_btn = document.getElementById("home-btn");
        this.status_btn = document.getElementById("status-btn");

        // Action bindings
        this.next_btn.addEventListener("click", () => this.nextQuestion());
        document.getElementById("shuffle-button").addEventListener("click", () => this.shuffleQuestions());
        document.getElementById("retake-button").addEventListener("click", () => this.resetQuiz(true));
        this.home_btn.addEventListener("click", () => this.resetQuiz(false));
        this.status_btn.addEventListener("click", () => this.showResults());

        // Prepares initial questions copies
        this.loadQuestions(this.original_order);
      }

      /**
       * Deep copies the questions and randomizes the order of their options.
       * Args:
       * source_questions (Array): The raw question data list.
       * Returns:
       * void
       */
      loadQuestions(source_questions) {
        this.questions_list = source_questions.map(q => ({
          question: q.question,
          options: [...q.options],
          correct_index: q.correct_index,
          explanation: q.explanation
        }));
        this.randomizeOptions();
      }

      /**
       * Shuffles the answers/options for all questions.
       * Returns:
       * void
       */
      randomizeOptions() {
        this.questions_list.forEach(item => {
          // Finds correct text before options are shuffled
          const correct_text = item.options[item.correct_index];
          
          // Shuffles choices using Fisher-Yates
          for (let idx = item.options.length - 1; idx > 0; idx--) {
            const rand_idx = Math.floor(Math.random() * (idx + 1));
            [item.options[idx], item.options[rand_idx]] = [item.options[rand_idx], item.options[idx]];
          }
          
          // Registers the new index location
          item.correct_index = item.options.indexOf(correct_text);
        });
      }

      /**
       * Renders the navigation circles in the left sidebar.
       * Returns:
       * void
       */
      renderSidebar() {
        this.sidebar_grid.innerHTML = "";
        this.questions_list.forEach((_, idx) => {
          const li_el = document.createElement("li");
          li_el.className = "node-item";

          const btn_el = document.createElement("button");
          btn_el.className = "node-button";
          btn_el.textContent = idx + 1;
          
          btn_el.addEventListener("click", () => this.jumpToQuestion(idx));

          li_el.appendChild(btn_el);
          this.sidebar_grid.appendChild(li_el);
        });
      }

      /**
       * Prepares engine for initialization.
       * Returns:
       * void
       */
      initQuiz() {
        this.current_index = 0;
        this.user_answers = new Array(this.questions_list.length).fill(null);

        this.quiz_view.style.display = "block";
        this.report_view.style.display = "none";
        this.status_btn.disabled = true;
        this.status_btn.classList.remove("active");

        this.renderSidebar();
        this.renderQuestion();
      }

      /**
       * Displays active question details.
       * Returns:
       * void
       */
      renderQuestion() {
        this.explanation_panel.style.display = "none";
        this.status_btn.classList.remove("active");

        const total_len = this.questions_list.length;

        // Updates active class status in sidebar circles
        const nodes = this.sidebar_grid.querySelectorAll(".node-button");
        nodes.forEach((n, idx) => {
          n.classList.remove("active", "correct", "incorrect");
          if (idx === this.current_index) {
            n.classList.add("active");
          }

          const ans = this.user_answers[idx];
          if (ans !== null) {
            if (ans.is_correct) {
              n.classList.add("correct");
            } else {
              n.classList.add("incorrect");
            }
          }
        });

        const item = this.questions_list[this.current_index];
        this.text_container.innerHTML = item.question;
        this.options_container.innerHTML = "";

        const ans_data = this.user_answers[this.current_index];

        item.options.forEach((opt, idx) => {
          const btn_el = document.createElement("button");
          btn_el.className = "option-row";
          btn_el.innerHTML = `<span>${opt}</span>`;

          if (ans_data === null) {
            // Unanswered state is interactive
            btn_el.addEventListener("click", () => this.selectOption(idx));
          } else {
            // Answered state is static/read-only
            btn_el.disabled = true;
            if (idx === item.correct_index) {
              btn_el.classList.add("correct");
              btn_el.insertAdjacentHTML("beforeend", `<span class="status-badge correct-badge">✓ Correct</span>`);
            } else if (idx === ans_data.selected_index) {
              btn_el.classList.add("incorrect");
              btn_el.insertAdjacentHTML("beforeend", `<span class="status-badge incorrect-badge">✗ Wrong</span>`);
            }
          }
          this.options_container.appendChild(btn_el);
        });

        // Recovers explanation block if question was already resolved
        if (ans_data !== null) {
          this.explanation_txt.innerHTML = item.explanation;
          this.explanation_panel.style.display = "block";
        }

        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise();
        }
      }

      /**
       * Reviews option selection accuracy.
       * Args:
       * selected_idx (number): The chosen option item index.
       * Returns:
       * void
       */
      selectOption(selected_idx) {
        // Prevents double answering same question
        if (this.user_answers[this.current_index] !== null) {
          return;
        }

        const current_q = this.questions_list[this.current_index];
        const correct_idx = current_q.correct_index;
        const opt_buttons = this.options_container.querySelectorAll(".option-row");

        const is_correct = (selected_idx === correct_idx);
        
        // Caches answer selection details
        this.user_answers[this.current_index] = {
          selected_index: selected_idx,
          is_correct: is_correct
        };

        // Highlights outcome elements
        if (is_correct) {
          opt_buttons[selected_idx].classList.add("correct");
          opt_buttons[selected_idx].insertAdjacentHTML("beforeend", `<span class="status-badge correct-badge">✓ Correct</span>`);
        } else {
          opt_buttons[selected_idx].classList.add("incorrect");
          opt_buttons[selected_idx].insertAdjacentHTML("beforeend", `<span class="status-badge incorrect-badge">✗ Wrong</span>`);
          
          opt_buttons[correct_idx].classList.add("correct");
          opt_buttons[correct_idx].insertAdjacentHTML("beforeend", `<span class="status-badge correct-badge">✓ Correct</span>`);
        }

        opt_buttons.forEach(btn => btn.disabled = true);

        // Reflects results immediately on corresponding sidebar nodes
        const nodes = this.sidebar_grid.querySelectorAll(".node-button");
        if (is_correct) {
          nodes[this.current_index].classList.add("correct");
        } else {
          nodes[this.current_index].classList.add("incorrect");
        }

        this.explanation_txt.innerHTML = current_q.explanation;
        this.explanation_panel.style.display = "block";

        // Activates summary status control if entire layout is complete
        const all_answered = this.user_answers.every(ans => ans !== null);
        if (all_answered) {
          this.status_btn.disabled = false;
        }

        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise();
        }
      }

      /**
       * Safe routing logic for sidebar node interactions.
       * Args:
       * target_idx (number): The grid item to route layout to.
       * Returns:
       * void
       */
      jumpToQuestion(target_idx) {
        this.current_index = target_idx;
        this.quiz_view.style.display = "block";
        this.report_view.style.display = "none";
        this.renderQuestion();
      }

      /**
       * Sets state to next question card.
       * Returns:
       * void
       */
      nextQuestion() {
        const total_len = this.questions_list.length;
        
        // Jumps to results panel if all questions have been answered
        const all_answered = this.user_answers.every(ans => ans !== null);
        if (all_answered) {
          this.showResults();
          return;
        }

        // Default jump from the current question to the next one if it is unanswered
        const next_idx = (this.current_index + 1) % total_len;
        if (this.user_answers[next_idx] === null) {
          this.current_index = next_idx;
          this.renderQuestion();
          return;
        }

        // Jumps to the most recent backtracked (skipped) question found by searching backwards
        let search_idx = (this.current_index - 1 + total_len) % total_len;
        while (search_idx !== this.current_index) {
          if (this.user_answers[search_idx] === null) {
            this.current_index = search_idx;
            this.renderQuestion();
            return;
          }
          search_idx = (search_idx - 1 + total_len) % total_len;
        }

        // Fallback to sequential index if no other unanswered question is found
        this.current_index = next_idx;
        this.renderQuestion();
      }

      /**
       * Visualizes the evaluation summary layout.
       * Returns:
       * void
       */
      showResults() {
        // Blocks display of evaluation if user has unanswered items
        const all_answered = this.user_answers.every(ans => ans !== null);
        if (!all_answered) {
          return;
        }

        this.quiz_view.style.display = "none";
        this.report_view.style.display = "flex";
        this.status_btn.disabled = false;
        this.status_btn.classList.add("active");

        const score = this.user_answers.filter(ans => ans && ans.is_correct).length;
        const total_len = this.questions_list.length;
        this.score_val.textContent = `${score} / ${total_len}`;

        // Deactivates active markers on circular nodes
        const nodes = this.sidebar_grid.querySelectorAll(".node-button");
        nodes.forEach(n => n.classList.remove("active"));
      }

      /**
       * Shuffles indices randomly and re-evaluates.
       * Returns:
       * void
       */
      shuffleQuestions() {
        const shuffled = [...this.original_order];
        for (let idx = shuffled.length - 1; idx > 0; idx--) {
          const rand_idx = Math.floor(Math.random() * (idx + 1));
          [shuffled[idx], shuffled[rand_idx]] = [shuffled[rand_idx], shuffled[idx]];
        }
        this.loadQuestions(shuffled);
        this.initQuiz();
      }

      /**
       * Restores sequencing to setup order.
       * Args:
       * keep_order (boolean): Directs ordering state.
       * Returns:
       * void
       */
      resetQuiz(keep_order) {
        if (keep_order) {
          // Re-shuffles active questions structure
          const current_seq = this.questions_list.map(q => {
            return this.original_order.find(o => o.question === q.question);
          });
          this.loadQuestions(current_seq);
        } else {
          this.loadQuestions(this.original_order);
        }
        this.initQuiz();
      }
    }

    // Instantiates Manager on load
    document.addEventListener("DOMContentLoaded", () => {
      const controller = new QuizManager(quiz_questions);
      controller.initQuiz();
    });
  </script>
</body>
</html>
