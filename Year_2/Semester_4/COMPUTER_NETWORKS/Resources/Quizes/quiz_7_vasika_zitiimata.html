<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Βασικά Ζητήματα - Quiz 7</title>

  <!-- MathJax Configuration -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>

  <style>
    /* CSS Variables for Split-Pane Workspace Dark Theme */
    :root {
      --bg-color: #0c0c0e;
      --sidebar-bg: #141417;
      --workspace-bg: #1a1a1e;
      --border-color: #2a2a32;
      --border-focus: #3e3e4a;
      --text-main: #f4f4f7;
      --text-muted: #8e8e9f;
      --accent-color: #8b5cf6;
      --accent-hover: #7c3aed;
      --accent-bg: rgba(139, 92, 246, 0.1);
      --success-color: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --error-color: #ef4444;
      --error-bg: rgba(239, 68, 68, 0.15);
    }

    /* Base body configurations with fluid fonts */
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: clamp(0.9em, 0.8vw + 0.6em, 1.25em);
      line-height: 1.5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    *, *::before, *::after {
      box-sizing: inherit;
    }

    /* Fluid container wrapping the sidebar and workspace */
    .app-workspace {
      display: flex;
      flex-direction: row;
      width: min(95%, 52em);
      height: min(90vh, 38em);
      background-color: var(--workspace-bg);
      border: 0.1em solid var(--border-color);
      border-radius: 1em;
      overflow: hidden;
      box-shadow: 0 1em 3em rgba(0, 0, 0, 0.4);
    }

    /* Left Sidebar Navigation */
    .sidebar {
      width: min(30%, 15em);
      background-color: var(--sidebar-bg);
      border-right: 0.1em solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 1.5em 1.2em;
      flex-shrink: 0;
    }

    .sidebar-title {
      font-size: 0.8em;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 0 0 1.5em 0;
      letter-spacing: 0.08em;
      border-bottom: 0.1em solid var(--border-color);
      padding-bottom: 0.8em;
    }

    .nodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(2.2em, 1fr));
      gap: 0.7em;
      margin: 0;
      padding: 0;
      list-style-type: none;
    }

    /* Interactive node buttons */
    .node-item {
      aspect-ratio: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .node-button {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 0.1em solid var(--border-color);
      background-color: transparent;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.9em;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .node-button:hover:not(:disabled) {
      border-color: var(--accent-color);
      background-color: var(--accent-bg);
    }

    /* Node states representing quiz progress */
    .node-button.active {
      border-color: var(--accent-color);
      background-color: var(--accent-color);
      color: var(--bg-color);
      box-shadow: 0 0 0.8em rgba(139, 92, 246, 0.4);
    }

    .node-button.correct {
      border-color: var(--success-color);
      background-color: var(--success-bg);
      color: var(--success-color);
    }

    .node-button.incorrect {
      border-color: var(--error-color);
      background-color: var(--error-bg);
      color: var(--error-color);
    }

    /* Sidebar footer and navigation slabs */
    .sidebar-footer {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5em;
      padding-top: 1em;
      border-top: 0.1em solid var(--border-color);
    }

    .sidebar-slab-btn {
      width: 100%;
      padding: 0.7em;
      border-radius: 0.4em;
      border: 0.1em solid var(--border-color);
      background-color: rgba(255, 255, 255, 0.02);
      color: var(--text-main);
      font-size: 0.85em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      font-family: inherit;
    }

    .sidebar-slab-btn:hover:not(:disabled) {
      background-color: var(--accent-bg);
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    .sidebar-slab-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .sidebar-slab-btn.active {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
      color: var(--bg-color);
      box-shadow: 0 0 0.8em rgba(139, 92, 246, 0.4);
    }

    /* Right Active Workspace Content Area */
    .workspace-content {
      flex-grow: 1;
      padding: 2em;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background-color: var(--workspace-bg);
    }

    .question-header {
      margin-bottom: 1.2em;
    }

    .topic-badge {
      font-size: 0.75em;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent-color);
      background-color: var(--accent-bg);
      padding: 0.3em 0.8em;
      border-radius: 1em;
      display: inline-block;
      margin-bottom: 0.8em;
    }

    .question-text {
      font-size: clamp(1.1em, 1.8vw + 0.6em, 1.35em);
      font-weight: 500;
      margin: 0;
      line-height: 1.5;
    }

    /* Option inputs styling */
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 0.7em;
      margin-bottom: 1.5em;
    }

    .option-row {
      width: 100%;
      text-align: left;
      padding: 0.9em 1.1em;
      background-color: rgba(255, 255, 255, 0.01);
      border: 0.1em solid var(--border-color);
      border-radius: 0.5em;
      color: var(--text-main);
      font-size: 0.92em;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .option-row:hover:not(:disabled) {
      background-color: rgba(255, 255, 255, 0.03);
      border-color: var(--border-focus);
    }

    .option-row:disabled {
      cursor: not-allowed;
    }

    /* Correctness highlights */
    .option-row.correct {
      background-color: var(--success-bg);
      border-color: var(--success-color);
      color: var(--success-color);
      font-weight: 600;
    }

    .option-row.incorrect {
      background-color: var(--error-bg);
      border-color: var(--error-color);
      color: var(--error-color);
      font-weight: 600;
    }

    .status-badge {
      font-size: 0.8em;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.2em 0.5em;
      border-radius: 0.25em;
      margin-left: 1em;
      flex-shrink: 0;
    }

    .status-badge.correct-badge {
      background-color: var(--success-color);
      color: var(--bg-color);
    }

    .status-badge.incorrect-badge {
      background-color: var(--error-color);
      color: var(--bg-color);
    }

    /* Explanation display panel */
    .explanation-panel {
      padding: 1em;
      background-color: rgba(255, 255, 255, 0.02);
      border-left: 0.2em solid var(--accent-color);
      border-radius: 0.25em;
      margin-bottom: 1.5em;
      display: none;
      font-size: 0.88em;
    }

    .explanation-title {
      font-weight: 600;
      color: var(--text-main);
      margin: 0 0 0.3em 0;
    }

    .explanation-text {
      color: var(--text-muted);
      margin: 0;
    }

    /* Footer section triggers */
    .workspace-footer {
      margin-top: auto;
      display: flex;
      justify-content: flex-end;
      padding-top: 1em;
      border-top: 0.1em solid var(--border-color);
    }

    .btn-primary {
      padding: 0.7em 1.5em;
      background-color: var(--accent-color);
      color: var(--text-main);
      border: none;
      border-radius: 0.4em;
      font-size: 0.92em;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Completed state summaries layout */
    .report-view {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    .report-title {
      font-size: 1.5em;
      font-weight: 700;
      margin: 0 0 1em 0;
    }

    .summary-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5em;
      background-color: rgba(255, 255, 255, 0.01);
      border: 0.1em solid var(--border-color);
      border-radius: 0.6em;
      margin-bottom: 1.5em;
    }

    .score-number {
      font-size: clamp(2.5em, 5vw + 1em, 3.8em);
      font-weight: 800;
      color: var(--accent-color);
      line-height: 1;
      margin-bottom: 0.2em;
    }

    .score-desc {
      font-size: 0.9em;
      color: var(--text-muted);
      text-align: center;
    }

    .click-hint {
      font-size: 0.85em;
      color: var(--accent-color);
      margin-top: 0.8em;
      font-weight: 600;
    }

    .report-controls {
      display: flex;
      gap: 1em;
      justify-content: center;
      margin-top: auto;
    }

    .btn-secondary {
      padding: 0.7em 1.5em;
      background: transparent;
      color: var(--text-main);
      border: 0.1em solid var(--border-color);
      border-radius: 0.4em;
      font-size: 0.92em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.03);
      border-color: var(--border-focus);
    }

    /* Responsive adjustment for small Viewports */
    @media (max-width: 32em) {
      .app-workspace {
        flex-direction: column;
        height: auto;
        min-height: min(90vh, 38em);
      }
      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 0.1em solid var(--border-color);
      }
    }
  </style>
</head>
<body>

  <div class="app-workspace">
    <!-- Left Navigation Sidebar -->
    <div class="sidebar">
      <div class="sidebar-title">Ερωτήσεις</div>
      <ul id="nodes-container" class="nodes-grid">
        <!-- Generates circular indicator nodes -->
      </ul>
      <div class="sidebar-footer">
        <button id="home-btn" class="sidebar-slab-btn">Home</button>
        <button id="status-btn" class="sidebar-slab-btn" disabled>Status</button>
      </div>
    </div>

    <!-- Right Content Workspace -->
    <div class="workspace-content">
      <!-- Active Question panel -->
      <div id="quiz-view">
        <div class="question-header">
          <div class="topic-badge">Βασικά Ζητήματα</div>
          <h2 id="question-text" class="question-text">Φόρτωση ερώτησης...</h2>
        </div>

        <div id="options-box" class="options-container">
          <!-- Populated dynamically -->
        </div>

        <div id="explanation-box" class="explanation-panel">
          <div class="explanation-title">Επεξήγηση</div>
          <p id="explanation-text" class="explanation-text"></p>
        </div>

        <div class="workspace-footer">
          <button id="next-button" class="btn-primary">Επόμενο</button>
        </div>
      </div>

      <!-- Final Report View -->
      <div id="report-view" class="report-view">
        <h2 class="report-title">Αξιολόγηση</h2>
        <div class="summary-card">
          <div id="score-display" class="score-number">0 / 0</div>
          <div class="score-desc">Σωστά Απαντημένες Ερωτήσεις</div>
          <div class="click-hint">Κάντε κλικ στα αριστερά νούμερα για αναλυτική επισκόπηση ερώτησης.</div>
        </div>

        <div class="report-controls">
          <button id="shuffle-button" class="btn-secondary">Shuffle</button>
          <button id="retake-button" class="btn-primary">Retake</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Variable casing rules: snake_case, functions: camelCase, classes: PascalCase

    const quiz_questions = [
      // --- ADDRESSES AND NAMES ---
      {
        question: "Πόσα bits έχει μια διεύθυνση MAC και σε ποιο επίπεδο του μοντέλου OSI χρησιμοποιείται;",
        options: [
          "32 bits, Network Layer (Layer 3)",
          "128 bits, Application Layer (Layer 7)",
          "48 bits, Data Link Layer (Layer 2)",
          "64 bits, Transport Layer (Layer 4)"
        ],
        correct_index: 2,
        explanation: "Η διεύθυνση MAC έχει μήκος 48 bits (6 bytes) και χρησιμοποιείται στο Επίπεδο Σύνδεσης Δεδομένων (Data Link Layer - Layer 2) για τη μεταφορά πλαισίων μεταξύ συσκευών στο ίδιο τοπικό δίκτυο (LAN)."
      },
      {
        question: "Ποιο από τα παρακάτω χαρακτηρίζει σωστά τη δομή μιας διεύθυνσης MAC;",
        options: [
          "Είναι ιεραρχική και αποτελείται από Network ID και Host ID",
          "Είναι επίπεδη (flat): τα πρώτα 24 bits είναι το OUI (κατασκευαστής) και τα τελευταία 24 bits ο μοναδικός σειριακός αριθμός",
          "Αποτελείται από οκτώ ομάδες δεκαεξαδικών ψηφίων χωρισμένων με άνω-κάτω τελείες",
          "Εκχωρείται δυναμικά από έναν DHCP server"
        ],
        correct_index: 1,
        explanation: "Η MAC address έχει επίπεδη (flat) δομή. Τα πρώτα 24 bits αποτελούν το OUI (Organizationally Unique Identifier) που προσδιορίζει τον κατασκευαστή, ενώ τα υπόλοιπα 24 bits είναι ο μοναδικός σειριακός αριθμός της κάρτας."
      },
      {
        question: "Ποια είναι η βασική διαφορά στη δομή μεταξύ μιας διεύθυνσης MAC και μιας διεύθυνσης IP;",
        options: [
          "Η MAC είναι ιεραρχική και η IP είναι επίπεδη",
          "Και οι δύο είναι επίπεδες αλλά διαφέρουν στο μήκος τους",
          "Η MAC είναι επίπεδη (flat) ενώ η IP είναι ιεραρχική (hierarchical)",
          "Δεν διαφέρουν δομικά, μόνο στο επίπεδο χρήσης τους"
        ],
        correct_index: 2,
        explanation: "Η MAC address έχει επίπεδη δομή (flat address space), χωρίς λογική γεωγραφική οργάνωση. Η IP address έχει ιεραρχική δομή (hierarchical), αποτελούμενη από Network Prefix και Host Identifier, επιτρέποντας παγκόσμια δρομολόγηση."
      },
      {
        question: "Στο IPv4, πόσα bits έχει μια διεύθυνση IP και ποια είναι η τυπική της μορφή;",
        options: [
          "128 bits, οκτώ ομάδες hex χωρισμένες με ':'",
          "48 bits, έξι ομάδες hex χωρισμένες με ':'",
          "64 bits, δύο 32-bit τμήματα",
          "32 bits, τέσσερα δεκαδικά ψηφία χωρισμένα με '.' (π.χ., 192.168.1.1)"
        ],
        correct_index: 3,
        explanation: "Στο IPv4, η διεύθυνση IP έχει μήκος 32 bits (4 bytes) και αναπαρίσταται ως τέσσερα δεκαδικά ψηφία χωρισμένα με τελείες (dotted-decimal notation), π.χ., 192.168.1.1."
      },
      {
        question: "Σε ποιο επίπεδο του OSI λειτουργούν τα ονόματα συστημάτων (hostnames / domain names) και ποιος μηχανισμός τα μεταφράζει σε IP διευθύνσεις;",
        options: [
          "Data Link Layer (Layer 2), μέσω ARP",
          "Network Layer (Layer 3), μέσω ICMP",
          "Transport Layer (Layer 4), μέσω TCP",
          "Application Layer (Layer 7), μέσω DNS"
        ],
        correct_index: 3,
        explanation: "Τα hostnames χρησιμοποιούνται στο Επίπεδο Εφαρμογής (Layer 7). Το DNS (Domain Name System) είναι το πρωτόκολλο αυτού του επιπέδου που τα μεταφράζει (resolves) σε αριθμητικές IP διευθύνσεις."
      },
      {
        question: "Ποιος είναι ο ορισμός του DNS (Domain Name System);",
        options: [
          "Ένα πρωτόκολλο μεταφοράς αρχείων μεταξύ web servers",
          "Μια κατανεμημένη, ιεραρχική βάση δεδομένων και πρωτόκολλο επιπέδου εφαρμογής που επιλύει hostnames σε IP διευθύνσεις",
          "Ένας κεντρικός server που αποθηκεύει όλες τις IP διευθύνσεις του Διαδικτύου",
          "Ένα πρωτόκολλο του Data Link Layer για εύρεση MAC addresses"
        ],
        correct_index: 1,
        explanation: "Το DNS είναι μια κατανεμημένη, ιεραρχική βάση δεδομένων (distributed hierarchical database) και πρωτόκολλο επιπέδου εφαρμογής που επιλύει ανθρωποκεντρικά hostnames σε αριθμητικές IP διευθύνσεις."
      },
      {
        question: "Ποια είναι η σωστή σειρά των επιπέδων εξυπηρετητών DNS από την υψηλότερη έως τη χαμηλότερη ιεραρχία;",
        options: [
          "Local DNS → TLD DNS → Root DNS → Authoritative DNS",
          "Authoritative DNS → TLD DNS → Root DNS → Local DNS",
          "Root DNS → TLD DNS → Authoritative DNS (με Local DNS ως resolver)",
          "TLD DNS → Root DNS → Local DNS → Authoritative DNS"
        ],
        correct_index: 2,
        explanation: "Η ιεραρχία DNS είναι: Root DNS Servers (κορυφή) → TLD DNS Servers (π.χ., .com, .gr) → Authoritative DNS Servers (τελικές επίσημες αντιστοιχίσεις). Ο Local DNS Server λειτουργεί ως resolver που εκτελεί αναδρομική αναζήτηση."
      },
      {
        question: "Τι χαρακτηρίζει τον Authoritative DNS Server;",
        options: [
          "Ανακατευθύνει αιτήματα στους Root DNS servers",
          "Ανήκει στον ISP και εξυπηρετεί μόνο τοπικά αιτήματα",
          "Ανήκει στον οργανισμό και παρέχει την τελική, επίσημη αντιστοίχιση Hostname-to-IP για τα συστήματά του",
          "Διαχειρίζεται τη ζώνη .com για όλα τα domains"
        ],
        correct_index: 2,
        explanation: "Ο Authoritative DNS Server ανήκει στον οργανισμό ή στην εταιρεία και παρέχει την τελική, επίσημη (authoritative) αντιστοίχιση Hostname-to-IP για τα συστήματά της. Είναι ο τελευταίος κρίκος στην αλυσίδα DNS resolution."
      },
      {
        question: "Το ARP (Address Resolution Protocol) επιλύει ποια αντιστοίχιση;",
        options: [
          "Hostname σε IP address",
          "IP address σε MAC address εντός του ίδιου LAN",
          "MAC address σε IP address παγκοσμίως",
          "IP address σε port number"
        ],
        correct_index: 1,
        explanation: "Το ARP επιλύει (resolves) μια λογική διεύθυνση IP σε αντίστοιχη φυσική διεύθυνση MAC εντός του ίδιου τοπικού δικτύου (LAN). Αυτό είναι απαραίτητο για τη δημιουργία πλαισίων Ethernet (Layer 2 frames)."
      },
      {
        question: "Πώς λειτουργεί ένα ARP Request;",
        options: [
          "Στέλνεται ως unicast απευθείας στη γνωστή IP διεύθυνση του προορισμού",
          "Στέλνεται ως multicast σε ομάδα συσκευών",
          "Στέλνεται ως broadcast (MAC: FF:FF:FF:FF:FF:FF) ρωτώντας ποιος έχει συγκεκριμένη IP",
          "Στέλνεται μόνο μέσω του default gateway"
        ],
        correct_index: 2,
        explanation: "Το ARP Request στέλνεται ως εκπομπή (broadcast) με διεύθυνση MAC προορισμού FF:FF:FF:FF:FF:FF, ρωτώντας: 'Ποιος έχει την IP X; Στείλτε μου τη MAC σας'. Όλες οι συσκευές στο LAN λαμβάνουν το αίτημα."
      },
      {
        question: "Τι αποθηκεύεται στο ARP Cache μιας συσκευής;",
        options: [
          "Οι αντιστοιχίσεις hostname-to-IP που έχουν ανακτηθεί μέσω DNS",
          "Τα πακέτα που αναμένουν να αποσταλούν",
          "Οι αντιστοιχίσεις IP-to-MAC που έχουν μάθει πρόσφατα μέσω ARP",
          "Ο πίνακας δρομολόγησης του router"
        ],
        correct_index: 2,
        explanation: "Το ARP Cache αποθηκεύει τις αντιστοιχίσεις IP-to-MAC που έχουν ανακτηθεί πρόσφατα μέσω ARP για μελλοντική χρήση, αποφεύγοντας επαναλαμβανόμενα ARP Requests για τις ίδιες IP διευθύνσεις."
      },
      {
        question: "Ποιο επίπεδο OSI χρησιμοποιεί η IP διεύθυνση για τη δρομολόγηση πακέτων και ποια είναι η εμβέλειά της;",

    // Tracks current question order (supports shuffle/retake)
    let current_order = [];
    // Tracks per-question answer state
    let answer_results = [];
    // Index of the currently displayed question
    let current_question_index = 0;
    // Tracks whether quiz is in review mode (post-completion)
    let is_review_mode = false;

    /**
     * Generates a shuffled copy of an array using Fisher-Yates algorithm.
     *
     * Args:
     *   arr (Array): The source array to shuffle.
     *
     * Returns:
     *   Array: A new shuffled array.
     */
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    /**
     * Initializes the quiz with a given question order and resets all state.
     *
     * Args:
     *   order (Array<number>): Array of question indices defining display order.
     */
    function initQuiz(order) {
      current_order = order;
      answer_results = new Array(order.length).fill(null);
      current_question_index = 0;
      is_review_mode = false;

      document.getElementById('quiz-view').style.display = 'block';
      document.getElementById('report-view').style.display = 'none';

      buildSidebar();
      renderQuestion(0);
    }

    /**
     * Builds the sidebar node buttons for each question.
     * Clears and repopulates the nodes grid.
     */
    function buildSidebar() {
      const container = document.getElementById('nodes-container');
      container.innerHTML = '';

      current_order.forEach((_, display_index) => {
        const li = document.createElement('li');
        li.className = 'node-item';

        const btn = document.createElement('button');
        btn.id = `node-btn-${display_index}`;
        btn.className = 'node-button';
        btn.textContent = display_index + 1;
        btn.addEventListener('click', () => jumpToQuestion(display_index));

        li.appendChild(btn);
        container.appendChild(li);
      });
    }

    /**
     * Renders the question at the given display index.
     * Restores the answered state if the question was already answered.
     *
     * Args:
     *   display_index (number): The index into current_order to display.
     */
    function renderQuestion(display_index) {
      current_question_index = display_index;

      // Highlight active node in sidebar
      document.querySelectorAll('.node-button').forEach((btn, i) => {
        btn.classList.toggle('active', i === display_index && answer_results[i] === null);
      });

      const question_data_index = current_order[display_index];
      const q = quiz_questions[question_data_index];

      // Shuffle options while tracking the correct one
      const indexed_options = q.options.map((text, i) => ({ text, original_index: i }));
      const shuffled_options = shuffleArray(indexed_options);
      const correct_shuffled_position = shuffled_options.findIndex(o => o.original_index === q.correct_index);

      document.getElementById('question-text').innerHTML = q.question;

      const options_box = document.getElementById('options-box');
      options_box.innerHTML = '';

      shuffled_options.forEach((option, pos) => {
        const btn = document.createElement('button');
        btn.className = 'option-row';
        btn.id = `option-btn-${display_index}-${pos}`;
        btn.dataset.correct_pos = correct_shuffled_position;
        btn.dataset.my_pos = pos;
        btn.innerHTML = `<span>${option.text}</span>`;

        btn.addEventListener('click', () => handleAnswer(display_index, pos, correct_shuffled_position, option.text, shuffled_options, q.explanation));

        options_box.appendChild(btn);
      });

      const explanation_box = document.getElementById('explanation-box');
      explanation_box.style.display = 'none';

      // Restore answered state if revisiting a completed question
      if (answer_results[display_index] !== null) {
        restoreAnswerState(display_index, shuffled_options, q.explanation, correct_shuffled_position);
      }

      const next_btn = document.getElementById('next-button');
      next_btn.disabled = answer_results[display_index] === null;
      next_btn.textContent = display_index === current_order.length - 1 ? 'Αποτελέσματα' : 'Επόμενο';

      // Re-render MathJax for dynamically inserted content
      if (window.MathJax) {
        MathJax.typesetPromise([document.getElementById('quiz-view')]);
      }
    }

    /**
     * Handles an answer click event, marking correct/incorrect states.
     *
     * Args:
     *   display_index (number): Current question display index.
     *   selected_pos (number): The position of the selected option.
     *   correct_pos (number): The position of the correct option.
     *   selected_text (string): The text of the selected option.
     *   shuffled_options (Array): The shuffled options array.
     *   explanation (string): The explanation text for this question.
     */
    function handleAnswer(display_index, selected_pos, correct_pos, selected_text, shuffled_options, explanation) {
      if (answer_results[display_index] !== null) return;

      const is_correct = selected_pos === correct_pos;
      answer_results[display_index] = is_correct;

      // Disable all options and apply visual feedback
      const option_btns = document.querySelectorAll('.option-row');
      option_btns.forEach((btn, pos) => {
        btn.disabled = true;
        if (pos === correct_pos) {
          btn.classList.add('correct');
          const badge = document.createElement('span');
          badge.className = 'status-badge correct-badge';
          badge.textContent = 'Σωστό';
          btn.appendChild(badge);
        } else if (pos === selected_pos && !is_correct) {
          btn.classList.add('incorrect');
          const badge = document.createElement('span');
          badge.className = 'status-badge incorrect-badge';
          badge.textContent = 'Λάθος';
          btn.appendChild(badge);
        }
      });

      // Show explanation
      const explanation_box = document.getElementById('explanation-box');
      document.getElementById('explanation-text').innerHTML = explanation;
      explanation_box.style.display = 'block';

      // Update sidebar node state
      const node_btn = document.getElementById(`node-btn-${display_index}`);
      if (node_btn) {
        node_btn.classList.remove('active');
        node_btn.classList.add(is_correct ? 'correct' : 'incorrect');
      }

      document.getElementById('next-button').disabled = false;

      if (window.MathJax) {
        MathJax.typesetPromise([explanation_box]);
      }

      checkAllAnswered();
    }

    /**
     * Restores the visual answered state for a revisited question.
     *
     * Args:
     *   display_index (number): The display index of the question.
     *   shuffled_options (Array): The shuffled options for this question.
     *   explanation (string): Explanation text to show.
     *   correct_pos (number): The correct option position in shuffled order.
     */
    function restoreAnswerState(display_index, shuffled_options, explanation, correct_pos) {
      const option_btns = document.querySelectorAll('.option-row');
      option_btns.forEach((btn, pos) => {
        btn.disabled = true;
        if (pos === correct_pos) {
          btn.classList.add('correct');
          const badge = document.createElement('span');
          badge.className = 'status-badge correct-badge';
          badge.textContent = 'Σωστό';
          btn.appendChild(badge);
        }
      });

      const explanation_box = document.getElementById('explanation-box');
      document.getElementById('explanation-text').innerHTML = explanation;
      explanation_box.style.display = 'block';

      if (window.MathJax) {
        MathJax.typesetPromise([explanation_box]);
      }
    }

    /**
     * Navigates to a specific question by its display index.
     *
     * Args:
     *   display_index (number): The target question display index.
     */
    function jumpToQuestion(display_index) {
      const quiz_view = document.getElementById('quiz-view');
      const report_view = document.getElementById('report-view');

      if (report_view.style.display === 'flex') {
        report_view.style.display = 'none';
        quiz_view.style.display = 'block';
        is_review_mode = true;
      }

      renderQuestion(display_index);
    }

    /**
     * Checks if all questions have been answered and triggers the report if so.
     */
    function checkAllAnswered() {
      const all_done = answer_results.every(r => r !== null);
      if (all_done) {
        document.getElementById('status-btn').disabled = false;
      }
    }

    /**
     * Displays the final score report view.
     */
    function showReport() {
      const correct_count = answer_results.filter(r => r === true).length;
      document.getElementById('score-display').textContent = `${correct_count} / ${current_order.length}`;

      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('report-view').style.display = 'flex';
    }

    // --- Event Listeners ---

    document.getElementById('next-button').addEventListener('click', () => {
      if (current_question_index < current_order.length - 1) {
        renderQuestion(current_question_index + 1);
      } else {
        showReport();
      }
    });

    document.getElementById('home-btn').addEventListener('click', () => {
      initQuiz(Array.from({ length: quiz_questions.length }, (_, i) => i));
    });

    document.getElementById('status-btn').addEventListener('click', () => {
      showReport();
    });

    document.getElementById('shuffle-button').addEventListener('click', () => {
      const shuffled_order = shuffleArray(Array.from({ length: quiz_questions.length }, (_, i) => i));
      initQuiz(shuffled_order);
    });

    document.getElementById('retake-button').addEventListener('click', () => {
      initQuiz([...current_order]);
    });

    // --- Initial Load ---
    initQuiz(Array.from({ length: quiz_questions.length }, (_, i) => i));
  </script>
</body>
</html>
