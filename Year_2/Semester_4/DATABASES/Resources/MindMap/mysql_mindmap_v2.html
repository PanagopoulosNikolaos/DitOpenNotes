<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The MySQL Workshop – Mind Map</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #141720;
      font-family: "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    h1 {
      text-align: center;
      padding: 14px 0 4px;
      font-size: 1rem;
      color: #89b4fa;
      letter-spacing: 0.05em;
    }

    #hint {
      text-align: center;
      font-size: 0.7rem;
      color: #45475a;
      margin-bottom: 6px;
    }

    #wrap {
      width: 100vw;
      height: calc(100vh - 62px);
      overflow: hidden;
      cursor: grab;
      position: relative;
    }

    #wrap:active {
      cursor: grabbing;
    }

    #vp {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
    }

    svg {
      display: block;
      overflow: visible;
    }

    /* Level colours */
    .n0 rect {
      fill: #1c2038;
      stroke: #89b4fa;
      stroke-width: 2.4;
    }

    .n0 text {
      fill: #89b4fa;
      font-weight: 800;
      font-size: 14px;
    }

    .n1 rect {
      fill: #112830;
      stroke: #00e5c8;
      stroke-width: 2.2;
    }

    .n1 text {
      fill: #00e5c8;
      font-weight: 700;
      font-size: 12px;
    }

    .n2 rect {
      fill: #21163a;
      stroke: #c084fc;
      stroke-width: 1.8;
    }

    .n2 text {
      fill: #c084fc;
      font-weight: 600;
      font-size: 11px;
    }

    .n3 rect {
      fill: #2b1a08;
      stroke: #fbbf24;
      stroke-width: 1.4;
    }

    .n3 text {
      fill: #fbbf24;
      font-size: 10.5px;
    }

    .ng {
      cursor: pointer;
    }

    .ng rect {
      rx: 7;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, .6));
      transition: filter .18s ease;
    }

    .ng:hover rect {
      filter: brightness(1.4) drop-shadow(0 0 10px rgba(255, 255, 255, .15));
    }

    .edge {
      fill: none;
      stroke-linecap: round;
    }

    .e1 {
      stroke: #00e5c8;
      stroke-width: 1.7;
      opacity: .55;
    }

    .e2 {
      stroke: #c084fc;
      stroke-width: 1.4;
      opacity: .5;
    }

    .e3 {
      stroke: #fbbf24;
      stroke-width: 1.2;
      opacity: .4;
    }

    .cbtn {
      cursor: pointer;
      stroke-width: 1.4;
    }

    .cb0 {
      fill: #1c2038;
      stroke: #89b4fa;
    }

    .cb1 {
      fill: #112830;
      stroke: #00e5c8;
    }

    .cb2 {
      fill: #21163a;
      stroke: #c084fc;
    }

    .cb0:hover,
    .cb1:hover,
    .cb2:hover {
      fill: #334;
    }

    .cico {
      pointer-events: none;
      font-size: 12px;
      font-family: monospace;
      dominant-baseline: middle;
      text-anchor: middle;
      fill: #e2e8f0;
    }
  </style>
</head>

<body>
  <h1>&#128196; The MySQL Workshop</h1>
  <p id="hint">Click nodes to expand/collapse &nbsp;·&nbsp; Drag to pan &nbsp;·&nbsp; Scroll to zoom</p>
  <div id="wrap">
    <div id="vp"><svg id="mm" xmlns="http://www.w3.org/2000/svg"></svg></div>
  </div>

  <script>
    const DATA = {
      id: "root", label: "The MySQL Workshop", level: 0, children: [
        {
          id: "bg", label: "Background Concepts", level: 1, children: [
            {
              id: "db", label: "Databases", level: 2, children: [
                { id: "db1", label: "Relational (RDBMS)", level: 3 },
                { id: "db2", label: "Object-based", level: 3 },
                { id: "db3", label: "Centralized vs Distributed", level: 3 }
              ]
            },
            {
              id: "arch", label: "MySQL Architecture", level: 2, children: [
                { id: "arch1", label: "Application Layer", level: 3 },
                { id: "arch2", label: "Logical Layer", level: 3 },
                { id: "arch3", label: "Physical Layer (Storage Engine)", level: 3 }
              ]
            },
            {
              id: "di", label: "Data Integrity", level: 2, children: [
                { id: "di1", label: "ACID Compliance", level: 3 },
                { id: "di2", label: "Normalization (1NF, 2NF, 3NF)", level: 3 }
              ]
            }
          ]
        },
        {
          id: "cm", label: "Creating and Managing Databases", level: 1, children: [
            {
              id: "wb", label: "MySQL Workbench", level: 2, children: [
                { id: "wb1", label: "GUI Interface", level: 3 },
                { id: "wb2", label: "EER Modeling", level: 3 },
                { id: "wb3", label: "Data Import/Export", level: 3 }
              ]
            },
            {
              id: "dbo", label: "Database Objects", level: 2, children: [
                { id: "dbo1", label: "Tables", level: 3 },
                { id: "dbo2", label: "Indexes", level: 3 },
                { id: "dbo3", label: "Foreign Keys", level: 3 },
                { id: "dbo4", label: "Stored Procedures", level: 3 },
                { id: "dbo5", label: "Views", level: 3 }
              ]
            }
          ]
        },
        {
          id: "sql", label: "SQL Operations", level: 1, children: [
            {
              id: "dml", label: "Data Manipulation (DML)", level: 2, children: [
                { id: "dml1", label: "SELECT", level: 3 },
                { id: "dml2", label: "INSERT", level: 3 },
                { id: "dml3", label: "UPDATE", level: 3 },
                { id: "dml4", label: "DELETE", level: 3 }
              ]
            },
            {
              id: "ddl", label: "Data Definition (DDL)", level: 2, children: [
                { id: "ddl1", label: "CREATE", level: 3 },
                { id: "ddl2", label: "ALTER", level: 3 },
                { id: "ddl3", label: "DROP", level: 3 }
              ]
            }
          ]
        },
        {
          id: "ci", label: "Connectivity and Integration", level: 1, children: [
            { id: "ci1", label: "Node.js Clients", level: 3 },
            { id: "ci2", label: "Microsoft Access Integration", level: 3 },
            { id: "ci3", label: "Excel VBA and ODBC", level: 3 },
            { id: "ci4", label: "X DevAPI (NoSQL)", level: 3 }
          ]
        },
        {
          id: "sm", label: "Security and Maintenance", level: 1, children: [
            { id: "sm1", label: "User Roles and Privileges", level: 3 },
            { id: "sm2", label: "Logical Backups (mysqldump)", level: 3 },
            { id: "sm3", label: "Point-in-time Recovery", level: 3 }
          ]
        }
      ]
    };

    const FONT = { 0: 14, 1: 12, 2: 11, 3: 10.5 }, NH = { 0: 38, 1: 32, 2: 28, 3: 26 };
    const HGAP = 90, VGAP = 18, PX = 24;
    const LC = ["n0", "n1", "n2", "n3"], EC = ["e1", "e1", "e2", "e3"], BC = ["cb0", "cb1", "cb2", "cb2"];
    const collapsed = {};
    const nodeState = {}; // id -> {g, rect, txt, ico, circ, curX, curY}
    const edgeEls = {};   // "pid|cid" -> pathEl
    const NS = "http://www.w3.org/2000/svg";
    const svg = document.getElementById("mm");
    const wrap = document.getElementById("wrap");
    const vp = document.getElementById("vp");

    function mkEl(t, a = {}) {
      const e = document.createElementNS(NS, t);
      for (const [k, v] of Object.entries(a)) e.setAttribute(k, v);
      return e;
    }

    // ── Layers
    let EL = mkEl("g", { id: "el" }), NL = mkEl("g", { id: "nl" });
    svg.appendChild(EL); svg.appendChild(NL);

    function nw(n) { return Math.min(Math.max(n.label.length * FONT[n.level] * 0.63 + PX * 2, 92), 250); }
    function visK(n) { return (!collapsed[n.id] && n.children) || []; }

    function layout(n) {
      n.w = nw(n); n.h = NH[n.level];
      const k = visK(n);
      if (!k.length) { n.sh = n.h; return; }
      k.forEach(c => layout(c));
      const tot = k.reduce((s, c) => s + c.sh, 0) + (k.length - 1) * VGAP;
      n.sh = Math.max(n.h, tot);
    }

    function place(n, x, y) {
      n.x = x; n.y = y + (n.sh - n.h) / 2;
      const k = visK(n); let cy = y;
      k.forEach(c => { place(c, x + n.w + HGAP, cy); cy += c.sh + VGAP; });
    }

    // ── Tweening
    const DUR = 480;
    let tweens = [], raf = null, rafLast = null;
    function ease(t) { return t < .5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }

    function startRaf() {
      if (raf) return;
      rafLast = null;
      raf = requestAnimationFrame(function tick(ts) {
        if (!rafLast) rafLast = ts;
        const dt = ts - rafLast; rafLast = ts;
        tweens.forEach(tw => {
          tw.e += dt;
          const t = ease(Math.min(tw.e / tw.d, 1));
          tw.fn(tw.a + (tw.b - tw.a) * t);
        });
        tweens = tweens.filter(tw => tw.e < tw.d);
        if (tweens.length) { raf = requestAnimationFrame(tick); }
        else { raf = null; }
      });
    }

    function tween(a, b, d, fn) { tweens.push({ a, b, d, e: 0, fn }); }

    // ── Collect all nodes/edges
    function allNodes(n, arr = []) { arr.push(n); visK(n).forEach(c => allNodes(c, arr)); return arr; }
    function allEdges(n, arr = []) { const k = visK(n); k.forEach(c => { arr.push([n, c]); allEdges(c, arr); }); return arr; }

    // ── Render / re-render
    function render(anim) {
      layout(DATA);
      const vh = wrap.clientHeight;
      place(DATA, 60, Math.max((vh - DATA.sh) / 2, 40));

      const nodes = allNodes(DATA), edges = allEdges(DATA);

      // svg size
      let mx = 0, my = 0;
      nodes.forEach(n => { mx = Math.max(mx, n.x + n.w + 60); my = Math.max(my, n.y + n.h + 60); });
      svg.setAttribute("width", mx); svg.setAttribute("height", my);

      // ── Nodes
      const visIds = new Set(nodes.map(n => n.id));
      Object.keys(nodeState).forEach(id => {
        if (!visIds.has(id)) { nodeState[id].g.remove(); delete nodeState[id]; }
      });

      nodes.forEach(n => {
        if (!nodeState[n.id]) {
          const g = mkEl("g", { class: `ng ${LC[n.level]}` });
          const rect = mkEl("rect", { width: n.w, height: n.h, rx: [8, 7, 6, 5][n.level] || 5 });
          const txt = mkEl("text", { "text-anchor": "middle", "dominant-baseline": "middle", "font-size": FONT[n.level] });
          txt.textContent = n.label;
          g.appendChild(rect); g.appendChild(txt);
          let circ = null, ico = null;
          if ((n.children || []).length) {
            const bl = Math.min(n.level, 2);
            circ = mkEl("circle", { r: 9, class: `cbtn ${BC[n.level] || BC[2]}` });
            ico = mkEl("text", { class: "cico" });
            ico.textContent = collapsed[n.id] ? "+" : "−";
            g.appendChild(circ); g.appendChild(ico);
          }
          g.addEventListener("click", () => {
            if (!(n.children || []).length) return;
            collapsed[n.id] = !collapsed[n.id];
            render(true);
          });
          NL.appendChild(g);
          nodeState[n.id] = { g, rect, txt, circ, ico, curX: n.x, curY: n.y };
        }
        const s = nodeState[n.id];
        // update sizes/labels
        s.rect.setAttribute("width", n.w); s.rect.setAttribute("height", n.h);
        s.txt.setAttribute("x", n.w / 2); s.txt.setAttribute("y", n.h / 2 + 1);
        const bx = n.w + 12, by = n.h / 2;
        if (s.circ) { s.circ.setAttribute("cx", bx); s.circ.setAttribute("cy", by); }
        if (s.ico) { s.ico.setAttribute("x", bx); s.ico.setAttribute("y", by + 1); s.ico.textContent = collapsed[n.id] ? "+" : "−"; }

        const tx = n.x, ty = n.y;
        if (anim && (s.curX !== tx || s.curY !== ty)) {
          const sx = s.curX, sy = s.curY;
          tween(sx, tx, DUR, v => { s.curX = v; s.g.setAttribute("transform", `translate(${s.curX},${s.curY})`); });
          tween(sy, ty, DUR, v => { s.curY = v; s.g.setAttribute("transform", `translate(${s.curX},${s.curY})`); });
        } else {
          s.curX = tx; s.curY = ty;
          s.g.setAttribute("transform", `translate(${tx},${ty})`);
        }
      });

      // ── Edges
      const visEK = new Set(edges.map(([p, c]) => p.id + "|" + c.id));
      Object.keys(edgeEls).forEach(k => { if (!visEK.has(k)) { edgeEls[k].remove(); delete edgeEls[k]; } });

      edges.forEach(([p, c]) => {
        const key = p.id + "|" + c.id;
        if (!edgeEls[key]) {
          const path = mkEl("path", { class: "edge " + EC[c.level] });
          EL.appendChild(path); edgeEls[key] = path;
        }
      });

      // Edge updater tween
      if (anim) {
        tween(0, 1, DUR, () => {
          edges.forEach(([p, c]) => {
            const key = p.id + "|" + c.id, path = edgeEls[key];
            if (!path) return;
            const ps = nodeState[p.id], cs = nodeState[c.id];
            if (!ps || !cs) return;
            const px = ps.curX + p.w, py = ps.curY + p.h / 2, cx = cs.curX, cy = cs.curY + c.h / 2, mx = (px + cx) / 2;
            path.setAttribute("d", `M${px},${py} C${mx},${py} ${mx},${cy} ${cx},${cy}`);
          });
        });
      } else {
        edges.forEach(([p, c]) => {
          const key = p.id + "|" + c.id;
          const px = p.x + p.w, py = p.y + p.h / 2, cx = c.x, cy = c.y + c.h / 2, mx = (px + cx) / 2;
          edgeEls[key].setAttribute("d", `M${px},${py} C${mx},${py} ${mx},${cy} ${cx},${cy}`);
        });
      }

      if (anim) startRaf();
    }

    // ── Pan & Zoom
    let panX = 0, panY = 0, sc = 1, drag = false, dsx = 0, dsy = 0, dpx = 0, dpy = 0;
    function applyT() { vp.style.transform = `translate(${panX}px,${panY}px) scale(${sc})`; }
    wrap.addEventListener("mousedown", e => { drag = true; dsx = e.clientX; dsy = e.clientY; dpx = panX; dpy = panY; });
    window.addEventListener("mousemove", e => { if (!drag) return; panX = dpx + (e.clientX - dsx); panY = dpy + (e.clientY - dsy); applyT(); });
    window.addEventListener("mouseup", () => drag = false);
    wrap.addEventListener("wheel", e => {
      e.preventDefault();
      const f = e.deltaY < 0 ? 1.1 : 0.91;
      const r = wrap.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      panX = mx - (mx - panX) * f; panY = my - (my - panY) * f;
      sc = Math.max(0.2, Math.min(3, sc * f));
      applyT();
    }, { passive: false });

    render(false);
  </script>
</body>

</html>
