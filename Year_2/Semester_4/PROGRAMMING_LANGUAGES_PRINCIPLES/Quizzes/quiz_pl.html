<style>
:root {
  --bg-color: #0c0c0e;
  --sidebar-bg: #141417;
  --workspace-bg: #1a1a1e;
  --border-color: #2a2a32;
  --border-focus: #3e3e4a;
  --text-main: #f4f4f7;
  --text-muted: #8e8e9f;
  --accent-color: #8b5cf6;
  --accent-hover: #7c3aed;
  --accent-bg: rgba(139,92,246,0.1);
  --success-color: #10b981;
  --success-bg: rgba(16,185,129,0.15);
  --error-color: #ef4444;
  --error-bg: rgba(239,68,68,0.15);
}
body { margin:0; padding:0; background-color:var(--bg-color); color:var(--text-main); font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif; font-size:clamp(0.9em,0.8vw + 0.6em,1.25em); line-height:1.5; display:flex; justify-content:center; align-items:center; min-height:100vh; box-sizing:border-box; }
*, *::before, *::after { box-sizing:inherit; }
.app-workspace { display:flex; flex-direction:row; width:min(95%,52em); height:min(90vh,38em); background-color:var(--workspace-bg); border:0.1em solid var(--border-color); border-radius:1em; overflow:hidden; box-shadow:0 1em 3em rgba(0,0,0,0.4); }
.sidebar { width:min(30%,15em); background-color:var(--sidebar-bg); border-right:0.1em solid var(--border-color); display:flex; flex-direction:column; padding:1.5em 1.2em; flex-shrink:0; }
.sidebar-title { font-size:0.8em; font-weight:700; text-transform:uppercase; color:var(--text-muted); margin:0 0 1.5em 0; letter-spacing:0.08em; border-bottom:0.1em solid var(--border-color); padding-bottom:0.8em; }
.nodes-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(2.2em,1fr)); gap:0.7em; margin:0; padding:0; list-style-type:none; }
.node-item { aspect-ratio:1; display:flex; justify-content:center; align-items:center; }
.node-button { width:100%; height:100%; border-radius:50%; border:0.1em solid var(--border-color); background-color:transparent; color:var(--text-main); font-weight:600; font-size:0.9em; font-family:inherit; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s ease; }
.node-button:hover:not(:disabled) { border-color:var(--accent-color); background-color:var(--accent-bg); }
.node-button.active { border-color:var(--accent-color); background-color:var(--accent-color); color:var(--bg-color); box-shadow:0 0 0.8em rgba(139,92,246,0.4); }
.node-button.correct { border-color:var(--success-color); background-color:var(--success-bg); color:var(--success-color); }
.node-button.incorrect { border-color:var(--error-color); background-color:var(--error-bg); color:var(--error-color); }
.sidebar-footer { margin-top:auto; display:flex; flex-direction:column; gap:0.5em; padding-top:1em; border-top:0.1em solid var(--border-color); }
.sidebar-slab-btn { width:100%; padding:0.7em; border-radius:0.4em; border:0.1em solid var(--border-color); background-color:rgba(255,255,255,0.02); color:var(--text-main); font-size:0.85em; font-weight:600; cursor:pointer; transition:all 0.2s ease; text-align:center; font-family:inherit; }
.sidebar-slab-btn:hover:not(:disabled) { background-color:var(--accent-bg); border-color:var(--accent-color); color:var(--accent-color); }
.sidebar-slab-btn:disabled { opacity:0.3; cursor:not-allowed; }
.sidebar-slab-btn.active { background-color:var(--accent-color); border-color:var(--accent-color); color:var(--bg-color); box-shadow:0 0 0.8em rgba(139,92,246,0.4); }
.workspace-content { flex-grow:1; padding:2em; display:flex; flex-direction:column; overflow-y:auto; background-color:var(--workspace-bg); }
.question-header { margin-bottom:1.2em; }
.topic-badge { font-size:0.75em; font-weight:700; text-transform:uppercase; color:var(--accent-color); background-color:var(--accent-bg); padding:0.3em 0.8em; border-radius:1em; display:inline-block; margin-bottom:0.8em; }
.question-text { font-size:clamp(1.1em,1.8vw + 0.6em,1.35em); font-weight:500; margin:0; line-height:1.5; }
.options-container { display:flex; flex-direction:column; gap:0.7em; margin-bottom:1.5em; }
.option-row { width:100%; text-align:left; padding:0.9em 1.1em; background-color:rgba(255,255,255,0.01); border:0.1em solid var(--border-color); border-radius:0.5em; color:var(--text-main); font-size:0.92em; font-family:inherit; cursor:pointer; transition:all 0.2s ease; display:flex; align-items:center; justify-content:space-between; }
.option-row:hover:not(:disabled) { background-color:rgba(255,255,255,0.03); border-color:var(--border-focus); }
.option-row:disabled { cursor:not-allowed; }
.option-row.correct { background-color:var(--success-bg); border-color:var(--success-color); color:var(--success-color); font-weight:600; }
.option-row.incorrect { background-color:var(--error-bg); border-color:var(--error-color); color:var(--error-color); font-weight:600; }
.status-badge { font-size:0.8em; font-weight:700; text-transform:uppercase; padding:0.2em 0.5em; border-radius:0.25em; margin-left:1em; flex-shrink:0; }
.status-badge.correct-badge { background-color:var(--success-color); color:var(--bg-color); }
.status-badge.incorrect-badge { background-color:var(--error-color); color:var(--bg-color); }
.explanation-panel { padding:1em; background-color:rgba(255,255,255,0.02); border-left:0.2em solid var(--accent-color); border-radius:0.25em; margin-bottom:1.5em; display:none; font-size:0.88em; }
.explanation-title { font-weight:600; color:var(--text-main); margin:0 0 0.3em 0; }
.explanation-text { color:var(--text-muted); margin:0; }
.workspace-footer { margin-top:auto; display:flex; justify-content:flex-end; padding-top:1em; border-top:0.1em solid var(--border-color); }
.btn-primary { padding:0.7em 1.5em; background-color:var(--accent-color); color:var(--text-main); border:none; border-radius:0.4em; font-size:0.92em; font-weight:600; cursor:pointer; transition:background-color 0.2s ease; }
.btn-primary:hover:not(:disabled) { background-color:var(--accent-hover); }
.btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
.report-view { display:none; flex-direction:column; height:100%; }
.report-title { font-size:1.5em; font-weight:700; margin:0 0 1em 0; }
.summary-card { display:flex; flex-direction:column; align-items:center; padding:1.5em; background-color:rgba(255,255,255,0.01); border:0.1em solid var(--border-color); border-radius:0.6em; margin-bottom:1.5em; }
.score-number { font-size:clamp(2.5em,5vw + 1em,3.8em); font-weight:800; color:var(--accent-color); line-height:1; margin-bottom:0.2em; }
.score-desc { font-size:0.9em; color:var(--text-muted); text-align:center; }
.click-hint { font-size:0.85em; color:var(--accent-color); margin-top:0.8em; font-weight:600; }
.report-controls { display:flex; gap:1em; justify-content:center; margin-top:auto; }
.btn-secondary { padding:0.7em 1.5em; background:transparent; color:var(--text-main); border:0.1em solid var(--border-color); border-radius:0.4em; font-size:0.92em; font-weight:600; cursor:pointer; transition:all 0.2s ease; }
.btn-secondary:hover { background-color:rgba(255,255,255,0.03); border-color:var(--border-focus); }
@media (max-width:32em) {
  .app-workspace { flex-direction:column; height:auto; min-height:min(90vh,38em); }
  .sidebar { width:100%; border-right:none; border-bottom:0.1em solid var(--border-color); }
}
pre { background:rgba(255,255,255,0.04); padding:0.5em 0.8em; border-radius:0.3em; font-size:0.85em; white-space:pre-wrap; margin:0.3em 0 0 0; color:#c9d1d9; }
code { background:rgba(255,255,255,0.06); padding:0.1em 0.3em; border-radius:0.2em; font-size:0.88em; color:#c9d1d9; }
</style>
</head>
<body>
<div class="app-workspace">
  <div class="sidebar">
    <div class="sidebar-title">Ερωτήσεις</div>
    <ul id="nodes-container" class="nodes-grid"></ul>
    <div class="sidebar-footer">
      <button id="home-btn" class="sidebar-slab-btn">Αρχή</button>
      <button id="status-btn" class="sidebar-slab-btn" disabled>Αποτελέσματα</button>
    </div>
  </div>
  <div class="workspace-content">
    <div id="quiz-view">
      <div class="question-header">
        <div class="topic-badge">ΑΡΧΕΣ ΓΛΩΣΣΩΝ ΠΡΟΓΡΑΜΜΑΤΙΣΜΟΥ</div>
        <h2 id="question-text" class="question-text">...</h2>
      </div>
      <div id="options-box" class="options-container"></div>
      <div id="explanation-box" class="explanation-panel">
        <div class="explanation-title">Εξήγηση</div>
        <p id="explanation-text" class="explanation-text"></p>
      </div>
      <div class="workspace-footer">
        <button id="next-button" class="btn-primary">Επόμενο →</button>
      </div>
    </div>
    <div id="report-view" class="report-view">
      <h2 class="report-title">Αποτελέσματα</h2>
      <div class="summary-card">
        <div id="score-display" class="score-number">0 / 0</div>
        <div class="score-desc">Σωστές απαντήσεις</div>
        <div class="click-hint">Κάντε κλικ στους κύκλους για να δείτε τις απαντήσεις</div>
      </div>
      <div class="report-controls">
        <button id="shuffle-button" class="btn-secondary">Ανακάτεμα</button>
        <button id="retake-button" class="btn-primary">Επανάληψη</button>
      </div>
    </div>
  </div>
</div>
<script>
const quizquestions = [
  // CH1 - Βασικές Έννοιες
  {
    question: "Τι εμφανίζει ο παρακάτω κώδικας C;<br><pre>int x = 5;\nint a = x++;\nprintf(\"%d %d\", a, x);</pre>",
    options: ["5 6", "6 6", "5 5", "6 5"],
    correctindex: 0,
    explanation: "Ο postfix τελεστής x++ επιστρέφει πρώτα την τρέχουσα τιμή (5) και μετά αυξάνει το x κατά 1. Άρα a=5, x=6."
  },
  {
    question: "Ποιες τιμές θεωρούνται <strong>ψευδείς</strong> (false) στη γλώσσα C;",
    options: ["0, 0.0, 0.0f, NULL", "0, 1, NULL, 'a'", "-1, 0.0, 3.5, NULL", "0, false, '', None"],
    correctindex: 0,
    explanation: "Στη C, ψευδείς τιμές είναι: 0, 0.0, 0.0f, NULL. Οι τιμές 1, -1, 3.5, 'a' κ.λπ. θεωρούνται αληθείς."
  },
  {
    question: "Ποια εντολή μεταγλώττισης GCC παράγει εκτελέσιμο με όνομα <code>my_program.exe</code> από το αρχείο <code>my_program.c</code>;",
    options: [
      "gcc my_program.c -o my_program.exe",
      "gcc -compile my_program.c my_program.exe",
      "gcc my_program.exe my_program.c",
      "gcc --output=my_program.exe my_program.c"
    ],
    correctindex: 0,
    explanation: "Η σωστή σύνταξη είναι: gcc my_program.c -o my_program.exe. Η επιλογή -o καθορίζει το όνομα του εκτελέσιμου."
  },
  {
    question: "Τι σημαίνει «ορθογωνικότητα» (orthogonality) σε γλώσσα προγραμματισμού;",
    options: [
      "Κάθε συνδυασμός χαρακτηριστικών της γλώσσας έχει νόημα και συμπεριφέρεται με συνεπή τρόπο",
      "Η γλώσσα υποστηρίζει μόνο ορθογώνια δεδομένα όπως πίνακες",
      "Η γλώσσα έχει ορθογώνια σύνταξη που διευκολύνει τον μεταγλωττιστή",
      "Τα modules της γλώσσας είναι ανεξάρτητα το ένα από το άλλο"
    ],
    correctindex: 0,
    explanation: "Ορθογωνικότητα σημαίνει ότι κάθε συνδυασμός δυνατοτήτων λειτουργεί με ομοιόμορφο τρόπο. Π.χ. παραβιάζεται στη C όταν οι πίνακες δεν επιτρέπουν στοιχεία τύπου void ενώ άλλοι τύποι επιτρέπονται."
  },
  // CH3 - Γραμματικές
  {
    question: "Δίνεται η γραμματική:<br><pre>S → AaBb\nA → Ab | b\nB → aB | a</pre>Ποιες από τις παρακάτω προτάσεις <strong>δεν</strong> ανήκουν στη γλώσσα;",
    options: [
      "bbbab και bbaaaaaS",
      "baab και bbaab",
      "baab και bbbab",
      "bbaaaaaS και bbaab"
    ],
    correctindex: 0,
    explanation: "Η γραμματική παράγει προτάσεις: 1+ b, μετά a, μετά 1+ a, μετά b. Το 'bbbab' έχει μόνο ένα a, και το 'bbaaaaaS' περιέχει μη-τερματικό σύμβολο S."
  },
  {
    question: "Τι σημαίνει ότι μια γραμματική είναι <strong>ασαφής</strong> (ambiguous);",
    options: [
      "Για την ίδια πρόταση μπορούν να παραχθούν δύο ή περισσότερα διαφορετικά δένδρα συντακτικής ανάλυσης",
      "Η γραμματική δεν μπορεί να αναγνωρίσει καμία πρόταση",
      "Η γραμματική έχει κανόνες που επικαλύπτονται μεταξύ τους",
      "Η γραμματική χρησιμοποιεί αναδρομή αριστερά"
    ],
    correctindex: 0,
    explanation: "Μια γραμματική είναι ασαφής όταν μια πρόταση της γλώσσας μπορεί να παραχθεί με περισσότερες από μία αριστερότερες παραγωγές, οδηγώντας σε διαφορετικά δένδρα συντακτικής ανάλυσης."
  },
  {
    question: "Τι επιλύει η διαφοροποίηση ανάμεσα σε <code>matched</code> και <code>unmatched</code> εντολές if σε μια γραμματική;",
    options: [
      "Το πρόβλημα dangling else (ξεκρέμαστο else)",
      "Την αριστερή αναδρομή στη γραμματική",
      "Την ασάφεια στις αριθμητικές εκφράσεις",
      "Την υπερχείλιση στοίβας κατά τη συντακτική ανάλυση"
    ],
    correctindex: 0,
    explanation: "Το dangling else επιλύεται επιβάλλοντας κάθε else να αντιστοιχεί στο πλησιέστερο προηγούμενο if, μέσω της διάκρισης matched/unmatched εντολών."
  },
  // CH5 - Binding / Scope
  {
    question: "Τι είναι <strong>πρόσδεση</strong> (binding) σε γλώσσα προγραμματισμού;",
    options: [
      "Η συσχέτιση ενός αναγνωριστικού με μια οντότητα (τύπο, τιμή, διεύθυνση μνήμης)",
      "Η διαδικασία δέσμευσης μνήμης κατά τη μεταγλώττιση",
      "Η σύνδεση αρχείων αντικειμένου σε εκτελέσιμο",
      "Η αντιστοίχιση παραμέτρων σε ορίσματα κατά την κλήση συνάρτησης"
    ],
    correctindex: 0,
    explanation: "Binding είναι η συσχέτιση αναγνωριστικού με οντότητα. Μπορεί να είναι στατική (compile-time) ή δυναμική (runtime). Στη C η x προσδένεται στον τύπο int κατά τη μεταγλώττιση."
  },
  {
    question: "Τι εμφανίζει ο κώδικας αν η γλώσσα υποστηρίζει <strong>στατική εμβέλεια</strong>;<br><pre>function outer(){\n  function inner2() { var y=x; print(y) }\n  var x = 16;\n  inner1(); // inner1 calls inner2, with local x=5\n}</pre>",
    options: ["16", "5", "0", "Σφάλμα εκτέλεσης"],
    correctindex: 0,
    explanation: "Με στατική εμβέλεια η x της inner2 αναζητείται στο λεξικό περιβάλλον ορισμού της (η outer), όπου x=16. Με δυναμική εμβέλεια θα εκτυπωνόταν 5 (η τιμή στο περιβάλλον κλήσης)."
  },
  {
    question: "Ποια είναι η διαφορά μεταξύ <strong>εμβέλειας</strong> (scope) και <strong>διάρκειας ζωής</strong> (lifetime) μεταβλητής;",
    options: [
      "Scope = πού είναι ορατή η μεταβλητή · Lifetime = πόσο διαρκεί η ύπαρξή της στη μνήμη",
      "Scope = πόσο διαρκεί η μεταβλητή · Lifetime = πού μπορεί να χρησιμοποιηθεί",
      "Είναι συνώνυμες έννοιες",
      "Scope αφορά τη μεταγλώττιση · Lifetime αφορά τη σύνδεση (linking)"
    ],
    correctindex: 0,
    explanation: "Scope ορίζει το τμήμα κώδικα στο οποίο είναι ορατή η μεταβλητή. Lifetime είναι το χρονικό διάστημα που η μεταβλητή υπάρχει στη μνήμη κατά την εκτέλεση. Μια static τοπική μεταβλητή στη C έχει τοπικό scope αλλά lifetime ίσο με ολόκληρη την εκτέλεση."
  },
  {
    question: "Τι εκτυπώνει ο κώδικας Python;<br><pre>x = 10\ndef f(): x = 5; print('f:', x)\ndef g(): print('g:', x)\nf(); g(); print('main:', x)</pre>",
    options: [
      "f: 5 / g: 10 / main: 10",
      "f: 10 / g: 10 / main: 10",
      "f: 5 / g: 5 / main: 5",
      "Σφάλμα UnboundLocalError"
    ],
    correctindex: 0,
    explanation: "Η f() ορίζει τοπική x=5 (δεν αλλάζει την global). Η g() χρησιμοποιεί την global x=10. Επομένως: f:5, g:10, main:10."
  },
  {
    question: "Τι σημαίνει το αρκτικόλεξο <strong>LEGB</strong> στην Python;",
    options: [
      "Local, Enclosing, Global, Built-in — η σειρά αναζήτησης ονομάτων",
      "List, Expression, Generator, Boolean — τύποι δεδομένων",
      "Lambda, Exception, Generator, Binding — λειτουργίες Python",
      "Local, External, Generic, Base — επίπεδα εμβέλειας"
    ],
    correctindex: 0,
    explanation: "LEGB: Local (τοπικό scope) → Enclosing (εξωτερικές συναρτήσεις) → Global (επίπεδο module) → Built-in (ενσωματωμένα ονόματα όπως print, len). Αυτή είναι η σειρά αναζήτησης μεταβλητών στην Python."
  },
  // CH6 - Τύποι Δεδομένων
  {
    question: "Γιατί η έκφραση <code>0.1 + 0.2 != 0.3</code> επιστρέφει <code>true</code> σε πιο πολλές γλώσσες;",
    options: [
      "Οι δεκαδικοί δεν αναπαρίστανται ακριβώς σε δυαδική κινητής υποδιαστολής (IEEE 754), με αποτέλεσμα σφάλματα στρογγυλοποίησης",
      "Ο τελεστής != λειτουργεί διαφορετικά για floats",
      "Οι τιμές 0.1 και 0.2 αποθηκεύονται ως ακέραιοι",
      "Είναι bug του μεταγλωττιστή"
    ],
    correctindex: 0,
    explanation: "Λόγω του προτύπου IEEE 754, τα 0.1 και 0.2 δεν αναπαρίστανται ακριβώς σε δυαδική μορφή. Το 0.1+0.2 δίνει 0.30000000000000004. Λύση: σύγκριση με fabs(a-b) < ε."
  },
  {
    question: "Τι είναι το <strong>IEEE 754</strong>;",
    options: [
      "Διεθνές πρότυπο αναπαράστασης αριθμών κινητής υποδιαστολής στους υπολογιστές (sign, exponent, mantissa)",
      "Πρωτόκολλο δικτύωσης για μεταφορά δυαδικών δεδομένων",
      "Πρότυπο κωδικοποίησης χαρακτήρων (Unicode)",
      "Αλγόριθμος συμπίεσης δεδομένων"
    ],
    correctindex: 0,
    explanation: "IEEE 754 ορίζει την αναπαράσταση floating-point: bit προσήμου, εκθέτης, και mantissa. Ορίζει επίσης float/double, κανόνες στρογγυλοποίησης και ειδικές τιμές (±∞, NaN)."
  },
  {
    question: "Στη διαίρεση αριθμών κινητής υποδιαστολής, ποιο αποτέλεσμα επιστρέφει το IEEE 754 για <code>0.0 / 0.0</code>;",
    options: ["NaN (Not a Number)", "+∞ (Infinity)", "0.0", "Undefined Behavior"],
    correctindex: 0,
    explanation: "Σύμφωνα με IEEE 754: 5/0 → +∞, -5/0 → -∞, 0/0 → NaN. Αντίθετα, ακέραια διαίρεση με μηδέν (int/int) είναι Undefined Behavior στη C."
  },
  {
    question: "Ποια είναι η διαφορά μεταξύ <code>struct</code> και <code>union</code> στη C;",
    options: [
      "Στη struct κάθε πεδίο έχει δική του μνήμη · στην union όλα τα πεδία μοιράζονται την ίδια θέση μνήμης",
      "Η struct επιτρέπει μόνο ακέραιους τύπους · η union επιτρέπει οποιοδήποτε τύπο",
      "Η struct είναι δυναμική δομή · η union είναι στατική",
      "Δεν υπάρχει διαφορά, είναι συνώνυμα"

class QuizManager {
  constructor(questions) {
    this.originalorder = questions;
    this.questionslist = [];
    this.useranswers = [];
    this.currentindex = 0;
    this.quizview = document.getElementById('quiz-view');
    this.reportview = document.getElementById('report-view');
    this.sidebargrid = document.getElementById('nodes-container');
    this.textcontainer = document.getElementById('question-text');
    this.optionscontainer = document.getElementById('options-box');
    this.explanationpanel = document.getElementById('explanation-box');
    this.explanationtxt = document.getElementById('explanation-text');
    this.nextbtn = document.getElementById('next-button');
    this.scoreval = document.getElementById('score-display');
    this.homebtn = document.getElementById('home-btn');
    this.statusbtn = document.getElementById('status-btn');
    this.nextbtn.addEventListener('click', () => this.nextQuestion());
    document.getElementById('shuffle-button').addEventListener('click', () => this.shuffleQuestions());
    document.getElementById('retake-button').addEventListener('click', () => this.resetQuiz(true));
    this.homebtn.addEventListener('click', () => this.resetQuiz(false));
    this.statusbtn.addEventListener('click', () => this.showResults());
    this.loadQuestions(this.originalorder);
  }
  loadQuestions(sourcequestions) {
    this.questionslist = sourcequestions.map(q => ({
      question: q.question,
      options: [...q.options],
      correctindex: q.correctindex,
      explanation: q.explanation
    }));
    this.randomizeOptions();
  }
  randomizeOptions() {
    this.questionslist.forEach(item => {
      const correcttext = item.options[item.correctindex];
      for (let idx = item.options.length - 1; idx > 0; idx--) {
        const randidx = Math.floor(Math.random() * (idx + 1));
        [item.options[idx], item.options[randidx]] = [item.options[randidx], item.options[idx]];
      }
      item.correctindex = item.options.indexOf(correcttext);
    });
  }
  renderSidebar() {
    this.sidebargrid.innerHTML = '';
    this.questionslist.forEach((_, idx) => {
      const liel = document.createElement('li');
      liel.className = 'node-item';
      const btnel = document.createElement('button');
      btnel.className = 'node-button';
      btnel.textContent = idx + 1;
      btnel.addEventListener('click', () => this.jumpToQuestion(idx));
      liel.appendChild(btnel);
      this.sidebargrid.appendChild(liel);
    });
  }
  initQuiz() {
    this.currentindex = 0;
    this.useranswers = new Array(this.questionslist.length).fill(null);
    this.quizview.style.display = 'block';
    this.reportview.style.display = 'none';
    this.statusbtn.disabled = true;
    this.statusbtn.classList.remove('active');
    this.renderSidebar();
    this.renderQuestion();
  }
  renderQuestion() {
    this.explanationpanel.style.display = 'none';
    this.statusbtn.classList.remove('active');
    const nodes = this.sidebargrid.querySelectorAll('.node-button');
    nodes.forEach((n, idx) => {
      n.classList.remove('active', 'correct', 'incorrect');
      if (idx === this.currentindex) n.classList.add('active');
      const ans = this.useranswers[idx];
      if (ans !== null) {
        if (ans.iscorrect) n.classList.add('correct');
        else n.classList.add('incorrect');
      }
    });
    const item = this.questionslist[this.currentindex];
    this.textcontainer.innerHTML = item.question;
    this.optionscontainer.innerHTML = '';
    const ansdata = this.useranswers[this.currentindex];
    item.options.forEach((opt, idx) => {
      const btnel = document.createElement('button');
      btnel.className = 'option-row';
      btnel.innerHTML = `<span>${opt}</span>`;
      if (ansdata === null) {
        btnel.addEventListener('click', () => this.selectOption(idx));
      } else {
        btnel.disabled = true;
        if (idx === item.correctindex) {
          btnel.classList.add('correct');
          btnel.insertAdjacentHTML('beforeend', '<span class="status-badge correct-badge">Σωστό</span>');
        } else if (idx === ansdata.selectedindex) {
          btnel.classList.add('incorrect');
          btnel.insertAdjacentHTML('beforeend', '<span class="status-badge incorrect-badge">Λάθος</span>');
        }
      }
      this.optionscontainer.appendChild(btnel);
    });
    if (ansdata !== null) {
      this.explanationtxt.innerHTML = item.explanation;
      this.explanationpanel.style.display = 'block';
    }
    if (window.MathJax) window.MathJax.typesetPromise();
  }
  selectOption(selectedidx) {
    if (this.useranswers[this.currentindex] !== null) return;
    const currentq = this.questionslist[this.currentindex];
    const correctidx = currentq.correctindex;
    const optbuttons = this.optionscontainer.querySelectorAll('.option-row');
    const iscorrect = selectedidx === correctidx;
    this.useranswers[this.currentindex] = { selectedindex: selectedidx, iscorrect };
    if (iscorrect) {
      optbuttons[selectedidx].classList.add('correct');
      optbuttons[selectedidx].insertAdjacentHTML('beforeend', '<span class="status-badge correct-badge">Σωστό</span>');
    } else {
      optbuttons[selectedidx].classList.add('incorrect');
      optbuttons[selectedidx].insertAdjacentHTML('beforeend', '<span class="status-badge incorrect-badge">Λάθος</span>');
      optbuttons[correctidx].classList.add('correct');
      optbuttons[correctidx].insertAdjacentHTML('beforeend', '<span class="status-badge correct-badge">Σωστό</span>');
    }
    optbuttons.forEach(btn => btn.disabled = true);
    const nodes = this.sidebargrid.querySelectorAll('.node-button');
    if (iscorrect) nodes[this.currentindex].classList.add('correct');
    else nodes[this.currentindex].classList.add('incorrect');
    this.explanationtxt.innerHTML = currentq.explanation;
    this.explanationpanel.style.display = 'block';
    const allanswered = this.useranswers.every(ans => ans !== null);
    if (allanswered) this.statusbtn.disabled = false;
    if (window.MathJax) window.MathJax.typesetPromise();
  }
  jumpToQuestion(targetidx) {
    this.currentindex = targetidx;
    this.quizview.style.display = 'block';
    this.reportview.style.display = 'none';
    this.renderQuestion();
  }
  nextQuestion() {
    const totallen = this.questionslist.length;
    const allanswered = this.useranswers.every(ans => ans !== null);
    if (allanswered) { this.showResults(); return; }
    const nextidx = (this.currentindex + 1) % totallen;
    if (this.useranswers[nextidx] === null) { this.currentindex = nextidx; this.renderQuestion(); return; }
    let searchidx = (this.currentindex - 1 + totallen) % totallen;
    while (searchidx !== this.currentindex) {
      if (this.useranswers[searchidx] === null) { this.currentindex = searchidx; this.renderQuestion(); return; }
      searchidx = (searchidx - 1 + totallen) % totallen;
    }
    this.currentindex = nextidx; this.renderQuestion();
  }
  showResults() {
    const allanswered = this.useranswers.every(ans => ans !== null);
    if (!allanswered) return;
    this.quizview.style.display = 'none';
    this.reportview.style.display = 'flex';
    this.statusbtn.disabled = false;
    this.statusbtn.classList.add('active');
    const score = this.useranswers.filter(ans => ans && ans.iscorrect).length;
    const totallen = this.questionslist.length;
    this.scoreval.textContent = `${score} / ${totallen}`;
    const nodes = this.sidebargrid.querySelectorAll('.node-button');
    nodes.forEach(n => n.classList.remove('active'));
  }
  shuffleQuestions() {
    const shuffled = [...this.originalorder];
    for (let idx = shuffled.length - 1; idx > 0; idx--) {
      const randidx = Math.floor(Math.random() * (idx + 1));
      [shuffled[idx], shuffled[randidx]] = [shuffled[randidx], shuffled[idx]];
    }
    this.loadQuestions(shuffled);
    this.initQuiz();
  }
  resetQuiz(keeporder) {
    if (keeporder) {
      const currentseq = this.questionslist.map(q => this.originalorder.find(o => o.question === q.question));
      this.loadQuestions(currentseq);
    } else {
      this.loadQuestions(this.originalorder);
    }
    this.initQuiz();
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const controller = new QuizManager(quizquestions);
  controller.initQuiz();
});
</script>
