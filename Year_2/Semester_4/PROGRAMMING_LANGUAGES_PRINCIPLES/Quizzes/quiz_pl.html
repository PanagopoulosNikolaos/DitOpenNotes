<style>
:root {
  --bg-color: #0c0c0e;
  --sidebar-bg: #141417;
  --workspace-bg: #1a1a1e;
  --border-color: #2a2a32;
  --border-focus: #3e3e4a;
  --text-main: #f4f4f7;
  --text-muted: #8e8e9f;
  --accent-color: #8b5cf6;
  --accent-hover: #7c3aed;
  --accent-bg: rgba(139,92,246,0.1);
  --success-color: #10b981;
  --success-bg: rgba(16,185,129,0.15);
  --error-color: #ef4444;
  --error-bg: rgba(239,68,68,0.15);
}
body { margin:0; padding:0; background-color:var(--bg-color); color:var(--text-main); font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif; font-size:clamp(0.9em,0.8vw + 0.6em,1.25em); line-height:1.5; display:flex; justify-content:center; align-items:center; min-height:100vh; box-sizing:border-box; }
*, *::before, *::after { box-sizing:inherit; }
.app-workspace { display:flex; flex-direction:row; width:min(95%,52em); height:min(90vh,38em); background-color:var(--workspace-bg); border:0.1em solid var(--border-color); border-radius:1em; overflow:hidden; box-shadow:0 1em 3em rgba(0,0,0,0.4); }
.sidebar { width:min(30%,15em); background-color:var(--sidebar-bg); border-right:0.1em solid var(--border-color); display:flex; flex-direction:column; padding:1.5em 1.2em; flex-shrink:0; }
.sidebar-title { font-size:0.8em; font-weight:700; text-transform:uppercase; color:var(--text-muted); margin:0 0 1.5em 0; letter-spacing:0.08em; border-bottom:0.1em solid var(--border-color); padding-bottom:0.8em; }
.nodes-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(2.2em,1fr)); gap:0.7em; margin:0; padding:0; list-style-type:none; }
.node-item { aspect-ratio:1; display:flex; justify-content:center; align-items:center; }
.node-button { width:100%; height:100%; border-radius:50%; border:0.1em solid var(--border-color); background-color:transparent; color:var(--text-main); font-weight:600; font-size:0.9em; font-family:inherit; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s ease; }
.node-button:hover:not(:disabled) { border-color:var(--accent-color); background-color:var(--accent-bg); }
.node-button.active { border-color:var(--accent-color); background-color:var(--accent-color); color:var(--bg-color); box-shadow:0 0 0.8em rgba(139,92,246,0.4); }
.node-button.correct { border-color:var(--success-color); background-color:var(--success-bg); color:var(--success-color); }
.correct-fill { }
.node-button.incorrect { border-color:var(--error-color); background-color:var(--error-bg); color:var(--error-color); }
.sidebar-footer { margin-top:auto; display:flex; flex-direction:column; gap:0.5em; padding-top:1em; border-top:0.1em solid var(--border-color); }
.sidebar-slab-btn { width:100%; padding:0.7em; border-radius:0.4em; border:0.1em solid var(--border-color); background-color:rgba(255,255,255,0.02); color:var(--text-main); font-size:0.85em; font-weight:600; cursor:pointer; transition:all 0.2s ease; text-align:center; font-family:inherit; }
.sidebar-slab-btn:hover:not(:disabled) { background-color:var(--accent-bg); border-color:var(--accent-color); color:var(--accent-color); }
.sidebar-slab-btn:disabled { opacity:0.3; cursor:not-allowed; }
.sidebar-slab-btn.active { background-color:var(--accent-color); border-color:var(--accent-color); color:var(--bg-color); box-shadow:0 0 0.8em rgba(139,92,246,0.4); }
.workspace-content { flex-grow:1; padding:2em; display:flex; flex-direction:column; overflow-y:auto; background-color:var(--workspace-bg); }
.question-header { margin-bottom:1.2em; }
.topic-badge { font-size:0.75em; font-weight:700; text-transform:uppercase; color:var(--accent-color); background-color:var(--accent-bg); padding:0.3em 0.8em; border-radius:1em; display:inline-block; margin-bottom:0.8em; }
.question-text { font-size:clamp(1.1em,1.8vw + 0.6em,1.35em); font-weight:500; margin:0; line-height:1.5; }
.options-container { display:flex; flex-direction:column; gap:0.7em; margin-bottom:1.5em; }
.option-row { width:100%; text-align:left; padding:0.9em 1.1em; background-color:rgba(255,255,255,0.01); border:0.1em solid var(--border-color); border-radius:0.5em; color:var(--text-main); font-size:0.92em; font-family:inherit; cursor:pointer; transition:all 0.2s ease; display:flex; align-items:center; justify-content:space-between; }
.option-row:hover:not(:disabled) { background-color:rgba(255,255,255,0.03); border-color:var(--border-focus); }
.option-row:disabled { cursor:not-allowed; }
.option-row.correct { background-color:var(--success-bg); border-color:var(--success-color); color:var(--success-color); font-weight:600; }
.option-row.incorrect { background-color:var(--error-bg); border-color:var(--error-color); color:var(--error-color); font-weight:600; }
.status-badge { font-size:0.8em; font-weight:700; text-transform:uppercase; padding:0.2em 0.5em; border-radius:0.25em; margin-left:1em; flex-shrink:0; }
.status-badge.correct-badge { background-color:var(--success-color); color:var(--bg-color); }
.status-badge.incorrect-badge { background-color:var(--error-color); color:var(--bg-color); }
.explanation-panel { padding:1em; background-color:rgba(255,255,255,0.02); border-left:0.2em solid var(--accent-color); border-radius:0.25em; margin-bottom:1.5em; display:none; font-size:0.88em; }
.explanation-title { font-weight:600; color:var(--text-main); margin:0 0 0.3em 0; }
.explanation-text { color:var(--text-muted); margin:0; }
.workspace-footer { margin-top:auto; display:flex; justify-content:flex-end; padding-top:1em; border-top:0.1em solid var(--border-color); }
.btn-primary { padding:0.7em 1.5em; background-color:var(--accent-color); color:var(--text-main); border:none; border-radius:0.4em; font-size:0.92em; font-weight:600; cursor:pointer; transition:background-color 0.2s ease; }
.btn-primary:hover:not(:disabled) { background-color:var(--accent-hover); }
.btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
.report-view { display:none; flex-direction:column; height:100%; }
.report-title { font-size:1.5em; font-weight:700; margin:0 0 1em 0; }
.summary-card { display:flex; flex-direction:column; align-items:center; padding:1.5em; background-color:rgba(255,255,255,0.01); border:0.1em solid var(--border-color); border-radius:0.6em; margin-bottom:1.5em; }
.score-number { font-size:clamp(2.5em,5vw + 1em,3.8em); font-weight:800; color:var(--accent-color); line-height:1; margin-bottom:0.2em; }
.score-desc { font-size:0.9em; color:var(--text-muted); text-align:center; }
.click-hint { font-size:0.85em; color:var(--accent-color); margin-top:0.8em; font-weight:600; }
.report-controls { display:flex; gap:1em; justify-content:center; margin-top:auto; }
.btn-secondary { padding:0.7em 1.5em; background:transparent; color:var(--text-main); border:0.1em solid var(--border-color); border-radius:0.4em; font-size:0.92em; font-weight:600; cursor:pointer; transition:all 0.2s ease; }
.btn-secondary:hover { background-color:rgba(255,255,255,0.03); border-color:var(--border-focus); }
@media (max-width:32em) {
  .app-workspace { flex-direction:column; height:auto; min-height:min(90vh,38em); }
  .sidebar { width:100%; border-right:none; border-bottom:0.1em solid var(--border-color); }
}
pre { background:rgba(255,255,255,0.04); padding:0.5em 0.8em; border-radius:0.3em; font-size:0.85em; white-space:pre-wrap; margin:0.3em 0 0 0; color:#c9d1d9; }
code { background:rgba(255,255,255,0.06); padding:0.1em 0.3em; border-radius:0.2em; font-size:0.88em; color:#c9d1d9; }
</style>
</head>
<body>
<div class="app-workspace">
  <div class="sidebar">
    <div class="sidebar-title">Questions</div>
    <ul id="nodes-container" class="nodes-grid"></ul>
    <div class="sidebar-footer">
      <button id="home-btn" class="sidebar-slab-btn">Home</button>
      <button id="status-btn" class="sidebar-slab-btn" disabled>Results</button>
    </div>
  </div>
  <div class="workspace-content">
    <div id="quiz-view">
      <div class="question-header">
        <div class="topic-badge">PRINCIPLES OF PROGRAMMING LANGUAGES</div>
        <h2 id="question-text" class="question-text">...</h2>
      </div>
      <div id="options-box" class="options-container"></div>
      <div id="explanation-box" class="explanation-panel">
        <div class="explanation-title">Explanation</div>
        <p id="explanation-text" class="explanation-text"></p>
      </div>
      <div class="workspace-footer">
        <button id="next-button" class="btn-primary">Next →</button>
      </div>
    </div>
    <div id="report-view" class="report-view">
      <h2 class="report-title">Results</h2>
      <div class="summary-card">
        <div id="score-display" class="score-number">0 / 0</div>
        <div class="score-desc">Correct answers</div>
        <div class="click-hint">Click the circles to see the answers</div>
      </div>
      <div class="report-controls">
        <button id="shuffle-button" class="btn-secondary">Shuffle</button>
        <button id="retake-button" class="btn-primary">Retake</button>
      </div>
    </div>
  </div>
</div>
<script>
const quizquestions = [
  // CH1 - Basic Concepts
  {
    question: "What does the following C code display?<br><pre>int x = 5;\nint a = x++;\nprintf(\"%d %d\", a, x);</pre>",
    options: ["5 6", "6 6", "5 5", "6 5"],
    correctindex: 0,
    explanation: "The postfix operator x++ first returns the current value (5) and then increments x by 1. So a=5, x=6."
  },
  {
    question: "Which values are considered <strong>false</strong> in the C language?",
    options: ["0, 0.0, 0.0f, NULL", "0, 1, NULL, 'a'", "-1, 0.0, 3.5, NULL", "0, false, '', None"],
    correctindex: 0,
    explanation: "In C, false values are: 0, 0.0, 0.0f, NULL. Values like 1, -1, 3.5, 'a' etc. are considered true."
  },
  {
    question: "Which GCC compilation command produces an executable named <code>my_program.exe</code> from the file <code>my_program.c</code>?",
    options: [
      "gcc my_program.c -o my_program.exe",
      "gcc -compile my_program.c my_program.exe",
      "gcc my_program.exe my_program.c",
      "gcc --output=my_program.exe my_program.c"
    ],
    correctindex: 0,
    explanation: "The correct syntax is: gcc my_program.c -o my_program.exe. The -o option specifies the name of the executable."
  },
  {
    question: "What does \"orthogonality\" mean in a programming language?",
    options: [
      "Every combination of language features is meaningful and behaves in a consistent way",
      "The language supports only rectangular data such as arrays",
      "The language has a rectangular syntax that facilitates the compiler",
      "The modules of the language are independent from each other"
    ],
    correctindex: 0,
    explanation: "Orthogonality means that every combination of features works in a uniform way. For example, it is violated in C when arrays do not allow void type elements while other types are allowed."
  },
  // CH3 - Grammars
  {
    question: "Given the grammar:<br><pre>S → AaBb\nA → Ab | b\nB → aB | a</pre>Which of the following strings <strong>do not</strong> belong to the language?",
    options: [
      "bbbab and bbaaaaaS",
      "baab and bbaab",
      "baab and bbbab",
      "bbaaaaaS and bbaab"
    ],
    correctindex: 0,
    explanation: "The grammar produces strings: 1+ b, then a, then 1+ a, then b. The string 'bbbab' has only one a, and 'bbaaaaaS' contains a non-terminal symbol S."
  },
  {
    question: "What does it mean for a grammar to be <strong>ambiguous</strong>?",
    options: [
      "For the same string, two or more different parse trees can be produced",
      "The grammar cannot recognize any string",
      "The grammar has rules that overlap with each other",
      "The grammar uses left recursion"
    ],
    correctindex: 0,
    explanation: "A grammar is ambiguous when a string of the language can be produced by more than one leftmost derivation, leading to different parse trees."
  },
  {
    question: "What does the distinction between <code>matched</code> and <code>unmatched</code> if statements resolve in a grammar?",
    options: [
      "The dangling else problem",
      "The left recursion in the grammar",
      "The ambiguity in arithmetic expressions",
      "The stack overflow during parsing"
    ],
    correctindex: 0,
    explanation: "The dangling else is resolved by forcing every else to correspond to the nearest preceding if, through the distinction of matched/unmatched statements."
  },
  // CH5 - Binding / Scope
  {
    question: "What is <strong>binding</strong> in a programming language?",
    options: [
      "The association of an identifier with an entity (type, value, memory address)",
      "The process of memory allocation during compilation",
      "The linking of object files into an executable",
      "The mapping of parameters to arguments during a function call"
    ],
    correctindex: 0,
    explanation: "Binding is the association of an identifier with an entity. It can be static (compile-time) or dynamic (runtime). In C, x is bound to the type int at compile time."
  },
  {
    question: "What does the code display if the language supports <strong>static scoping</strong>?<br><pre>function outer(){\n  function inner2() { var y=x; print(y) }\n  var x = 16;\n  inner1(); // inner1 calls inner2, with local x=5\n}</pre>",
    options: ["16", "5", "0", "Runtime error"],
    correctindex: 0,
    explanation: "With static scoping, the x of inner2 is looked up in its lexical definition environment (the outer), where x=16. With dynamic scoping, 5 would be printed (the value in the calling environment)."
  },
  {
    question: "What is the difference between the <strong>scope</strong> and the <strong>lifetime</strong> of a variable?",
    options: [
      "Scope = where the variable is visible · Lifetime = how long its existence in memory lasts",
      "Scope = how long the variable lasts · Lifetime = where it can be used",
      "They are synonymous concepts",
      "Scope concerns compilation · Lifetime concerns linking"
    ],
    correctindex: 0,
    explanation: "Scope defines the part of the code in which the variable is visible. Lifetime is the time interval during which the variable exists in memory during execution. A static local variable in C has local scope but a lifetime equal to the entire execution."
  },
  {
    question: "What does the Python code print?<br><pre>x = 10\ndef f(): x = 5; print('f:', x)\ndef g(): print('g:', x)\nf(); g(); print('main:', x)</pre>",
    options: [
      "f: 5 / g: 10 / main: 10",
      "f: 10 / g: 10 / main: 10",
      "f: 5 / g: 5 / main: 5",
      "UnboundLocalError"
    ],
    correctindex: 0,
    explanation: "f() defines local x=5 (does not change the global). g() uses the global x=10. Therefore: f:5, g:10, main:10."
  },
  {
    question: "What does the acronym <strong>LEGB</strong> mean in Python?",
    options: [
      "Local, Enclosing, Global, Built-in — the order of name lookup",
      "List, Expression, Generator, Boolean — data types",
      "Lambda, Exception, Generator, Binding — Python operations",
      "Local, External, Generic, Base — scoping levels"
    ],
    correctindex: 0,
    explanation: "LEGB: Local (local scope) → Enclosing (enclosing functions) → Global (module level) → Built-in (built-in names such as print, len). This is the order of variable lookup in Python."
  },
  // CH6 - Data Types
  {
    question: "Why does the expression <code>0.1 + 0.2 != 0.3</code> return <code>true</code> in many languages?",
    options: [
      "Decimals are not represented exactly in binary floating-point (IEEE 754), resulting in rounding errors",
      "The != operator works differently for floats",
      "The values 0.1 and 0.2 are stored as integers",
      "It is a compiler bug"
    ],
    correctindex: 0,
    explanation: "Due to the IEEE 754 standard, 0.1 and 0.2 are not represented exactly in binary form. 0.1+0.2 gives 0.30000000000000004. Solution: compare with fabs(a-b) < ε."
  },
  {
    question: "What is <strong>IEEE 754</strong>?",
    options: [
      "International standard for floating-point number representation in computers (sign, exponent, mantissa)",
      "Networking protocol for transferring binary data",
      "Character encoding standard (Unicode)",
      "Data compression algorithm"
    ],
    correctindex: 0,
    explanation: "IEEE 754 defines the floating-point representation: sign bit, exponent, and mantissa. It also defines float/double, rounding rules and special values (±∞, NaN)."
  },
  {
    question: "In floating-point division, what result does IEEE 754 return for <code>0,0 / 0,0</code>?",
    options: ["NaN (Not a Number)", "+∞ (Infinity)", "0.0", "Undefined Behavior"],
    correctindex: 0,
    explanation: "According to IEEE 754: 5/0 → +∞, -5/0 → -∞, 0/0 → NaN. In contrast, integer division by zero (int/int) is Undefined Behavior in C."
  },
  {
    question: "What is the difference between <code>struct</code> and <code>union</code> in C?",
    options: [
      "In struct each field has its own memory · in union all fields share the same memory location",
      "Struct allows only integer types · union allows any type",
      "Struct is a dynamic structure · union is static",
      "There is no difference, they are synonyms"
    ],
    correctindex: 0,
    explanation: "In struct, each member has a separate memory location — all values can coexist. In union, only one member can be stored at a time, saving memory."
  },
  {
    question: "What is the result of the Python slice <code>L[::2]</code> for the list <code>L = [10, 20, 30, 40, 50]</code>?",
    options: ["[10, 30, 50]", "[20, 40]", "[10, 20, 30, 40, 50]", "[50, 30, 10]"],
    correctindex: 0,
    explanation: "L[::2] selects every 2nd element starting from 0: L[0]=10, L[2]=30, L[4]=50 → [10, 30, 50]."
  },
  {
    question: "How does <strong>Java</strong> react to out-of-bounds array access (e.g., index 5 in a 4-element array)?",
    options: [
      "Throws ArrayIndexOutOfBoundsException",
      "Silently returns 0 or null",
      "Undefined Behavior — unspecified behavior",
      "Terminates the program without a message"
    ],
    correctindex: 0,
    explanation: "Java automatically checks array bounds. Out-of-bounds access → ArrayIndexOutOfBoundsException. In C, the same gives Undefined Behavior."
  },
  {
    question: "In <strong>row-major</strong> storage of a 3×4 array, what is the offset of element (1,2)?",
    options: ["6", "7", "5", "8"],
    correctindex: 0,
    explanation: "Row-major offset = i*cols + j = 1*4 + 2 = 6. For column-major it would be j*rows + i = 2*3 + 1 = 7. C and Java use row-major."
  },
  // CH7 - Expressions and Operators
  {
    question: "What does the C code print?<br><pre>int x = 5;\nint y = -x++;\nint z = --x;\nprintf(\"x=%d, y=%d, z=%d\", x, y, z);</pre>",
    options: ["x=5, y=-5, z=5", "x=6, y=-6, z=5", "x=5, y=-6, z=4", "x=4, y=-5, z=4"],
    correctindex: 0,
    explanation: "The ++ has higher precedence than the unary -. So -x++ ≡ -(x++): x++ returns 5 (then x=6), y=-5. Then --x: x becomes 5 and z=5."
  },
  {
    question: "What is the result of the Python expression <code>2**2**3</code>?",
    options: ["256", "64", "8", "512"],
    correctindex: 0,
    explanation: "The ** operator has right associativity. So: 2**2**3 = 2**(2**3) = 2**8 = 256."
  },
  {
    question: "What does the C code print?<br><pre>printf(\"%s\\n\", 4 <= 3 <= 5 ? \"true\" : \"false\");</pre>",
    options: ["true", "false", "Compilation error", "Undefined Behavior"],
    correctindex: 0,
    explanation: "4 <= 3 evaluates to 0 (false), then 0 <= 5 evaluates to 1 (true). So 'true' is printed. This is a trap — the correct form would be: 4 <= 3 && 3 <= 5, which gives false."
  },
  {
    question: "What is <strong>referential transparency</strong>?",
    options: [
      "A function always returns the same result for the same arguments, without side effects",
      "The ability to refer to external variables via pointers",
      "The transparency of memory in a pointer",
      "The degree of variable visibility across different scopes"
    ],
    correctindex: 0,
    explanation: "Referential transparency: f(x) can be replaced by its value without changing behavior. It is violated when the function has side effects (e.g., modifies a global variable)."
  },
  // CH12 - OOP
  {
    question: "What does \"<strong>class instance</strong>\" mean in object-oriented programming?",
    options: ["Object", "Subclass", "Abstract class", "Method"],
    correctindex: 0,
    explanation: "A class instance is an object — a specific creation (instantiation) of a class with its own state."
  },
  {
    question: "What is the difference between <code>__str__</code> and <code>__repr__</code> in Python?",
    options: [
      "__str__ returns a human-readable string · __repr__ returns a representation for reproducing the object",
      "__str__ is used only for numbers · __repr__ for strings",
      "__repr__ is called first · __str__ is an alternative",
      "They are equivalent methods"
    ],
    correctindex: 0,
    explanation: "__str__ provides a user-friendly display (print). __repr__ provides a representation that ideally could recreate the object (REPL, debugging)."
  },
  {
    question: "What does the C++ code print?<br><pre>class Base { public: virtual void show(){cout<<\"Arta\";} };\nclass Derived : public Base { public: void show() override {cout<<\"Ioannina\";} };\nBase *ptr = new Derived(); ptr->show();</pre>",
    options: ["Ioannina", "Arta", "Compilation error", "Undefined Behavior"],
    correctindex: 0,
    explanation: "The virtual keyword enables late binding — the Base* pointer points to Derived, so at runtime the Derived version is called: 'Ioannina'. Without virtual, 'Arta' would be printed."
  },
  {
    question: "What does the <code>super()</code> keyword do in Python when used in a subclass?",
    options: [
      "Calls the method of the parent class",
      "Creates a new object of the parent class",
      "Deletes the methods of the parent class",
      "Converts the object to the type of the parent class"
    ],
    correctindex: 0,
    explanation: "super().__init__(...) calls the constructor of the parent class. It is used to initialize the fields defined in the parent."
  },
  {
    question: "What is an <strong>abstract class</strong>?",
    options: [
      "A class for which objects cannot be created",
      "A class without data fields",
      "A class that inherits from many other classes",
      "A class that has no constructor"
    ],
    correctindex: 0,
    explanation: "An abstract class cannot directly create objects. It serves as a base class that defines a common interface for its subclasses."
  },
  // CH14 - Exceptions
  {
    question: "Which Python exception catches division by zero?",
    options: ["ZeroDivisionError", "ArithmeticError", "ValueError", "RuntimeError"],
    correctindex: 0,
    explanation: "ZeroDivisionError is raised when the divisor is 0. E.g.: try: x = 1/0 → except ZeroDivisionError: ..."
  },
  {
    question: "Which Python exception is raised on list access with an out-of-bounds index?",
    options: ["IndexError", "KeyError", "ValueError", "OverflowError"],
    correctindex: 0,
    explanation: "IndexError is raised when an invalid index is used for a list/tuple/string. KeyError is raised for a non-existent key in a dictionary."

class QuizManager {
  constructor(questions) {
    this.originalorder = questions;
    this.questionslist = [];
    this.useranswers = [];
    this.currentindex = 0;
    this.quizview = document.getElementById('quiz-view');
    this.reportview = document.getElementById('report-view');
    this.sidebargrid = document.getElementById('nodes-container');
    this.textcontainer = document.getElementById('question-text');
    this.optionscontainer = document.getElementById('options-box');
    this.explanationpanel = document.getElementById('explanation-box');
    this.explanationtxt = document.getElementById('explanation-text');
    this.nextbtn = document.getElementById('next-button');
    this.scoreval = document.getElementById('score-display');
    this.homebtn = document.getElementById('home-btn');
    this.statusbtn = document.getElementById('status-btn');
    this.nextbtn.addEventListener('click', () => this.nextQuestion());
    document.getElementById('shuffle-button').addEventListener('click', () => this.shuffleQuestions());
    document.getElementById('retake-button').addEventListener('click', () => this.resetQuiz(true));
    this.homebtn.addEventListener('click', () => this.resetQuiz(false));
    this.statusbtn.addEventListener('click', () => this.showResults());
    this.loadQuestions(this.originalorder);
  }
  loadQuestions(sourcequestions) {
    this.questionslist = sourcequestions.map(q => ({
      question: q.question,
      options: [...q.options],
      correctindex: q.correctindex,
      explanation: q.explanation
    }));
    this.randomizeOptions();
  }
  randomizeOptions() {
    this.questionslist.forEach(item => {
      const correcttext = item.options[item.correctindex];
      for (let idx = item.options.length - 1; idx > 0; idx--) {
        const randidx = Math.floor(Math.random() * (idx + 1));
        [item.options[idx], item.options[randidx]] = [item.options[randidx], item.options[idx]];
      }
      item.correctindex = item.options.indexOf(correcttext);
    });
  }
  renderSidebar() {
    this.sidebargrid.innerHTML = '';
    this.questionslist.forEach((_, idx) => {
      const liel = document.createElement('li');
      liel.className = 'node-item';
      const btnel = document.createElement('button');
      btnel.className = 'node-button';
      btnel.textContent = idx + 1;
      btnel.addEventListener('click', () => this.jumpToQuestion(idx));
      liel.appendChild(btnel);
      this.sidebargrid.appendChild(liel);
    });
  }
  initQuiz() {
    this.currentindex = 0;
    this.useranswers = new Array(this.questionslist.length).fill(null);
    this.quizview.style.display = 'block';
    this.reportview.style.display = 'none';
    this.statusbtn.disabled = true;
    this.statusbtn.classList.remove('active');
    this.renderSidebar();
    this.renderQuestion();
  }
  renderQuestion() {
    this.explanationpanel.style.display = 'none';
    this.statusbtn.classList.remove('active');
    const nodes = this.sidebargrid.querySelectorAll('.node-button');
    nodes.forEach((n, idx) => {
      n.classList.remove('active', 'correct', 'incorrect');
      if (idx === this.currentindex) n.classList.add('active');
      const ans = this.useranswers[idx];
      if (ans !== null) {
        if (ans.iscorrect) n.classList.add('correct');
        else n.classList.add('incorrect');
      }
    });
    const item = this.questionslist[this.currentindex];
    this.textcontainer.innerHTML = item.question;
    this.optionscontainer.innerHTML = '';
    const ansdata = this.useranswers[this.currentindex];
    item.options.forEach((opt, idx) => {
      const btnel = document.createElement('button');
      btnel.className = 'option-row';
      btnel.innerHTML = `<span>${opt}</span>`;
      if (ansdata === null) {
        btnel.addEventListener('click', () => this.selectOption(idx));
      } else {
        btnel.disabled = true;
        if (idx === item.correctindex) {
          btnel.classList.add('correct');
          btnel.insertAdjacentHTML('beforeend', '<span class="status-badge correct-badge">Correct</span>');
        } else if (idx === ansdata.selectedindex) {
          btnel.classList.add('incorrect');
          btnel.insertAdjacentHTML('beforeend', '<span class="status-badge incorrect-badge">Wrong</span>');
        }
      }
      this.optionscontainer.appendChild(btnel);
    });
    if (ansdata !== null) {
      this.explanationtxt.innerHTML = item.explanation;
      this.explanationpanel.style.display = 'block';
    }
    if (window.MathJax) window.MathJax.typesetPromise();
  }
  selectOption(selectedidx) {
    if (this.useranswers[this.currentindex] !== null) return;
    const currentq = this.questionslist[this.currentindex];
    const correctidx = currentq.correctindex;
    const optbuttons = this.optionscontainer.querySelectorAll('.option-row');
    const iscorrect = selectedidx === correctidx;
    this.useranswers[this.currentindex] = { selectedindex: selectedidx, iscorrect };
    if (iscorrect) {
      optbuttons[selectedidx].classList.add('correct');
      optbuttons[selectedidx].insertAdjacentHTML('beforeend', '<span class="status-badge correct-badge">Correct</span>');
    } else {
      optbuttons[selectedidx].classList.add('incorrect');
      optbuttons[selectedidx].insertAdjacentHTML('beforeend', '<span class="status-badge incorrect-badge">Wrong</span>');
      optbuttons[correctidx].classList.add('correct');
      optbuttons[correctidx].insertAdjacentHTML('beforeend', '<span class="status-badge correct-badge">Correct</span>');
    }
    optbuttons.forEach(btn => btn.disabled = true);
    const nodes = this.sidebargrid.querySelectorAll('.node-button');
    if (iscorrect) nodes[this.currentindex].classList.add('correct');
    else nodes[this.currentindex].classList.add('incorrect');
    this.explanationtxt.innerHTML = currentq.explanation;
    this.explanationpanel.style.display = 'block';
    const allanswered = this.useranswers.every(ans => ans !== null);
    if (allanswered) this.statusbtn.disabled = false;
    if (window.MathJax) window.MathJax.typesetPromise();
  }
  jumpToQuestion(targetidx) {
    this.currentindex = targetidx;
    this.quizview.style.display = 'block';
    this.reportview.style.display = 'none';
    this.renderQuestion();
  }
  nextQuestion() {
    const totallen = this.questionslist.length;
    const allanswered = this.useranswers.every(ans => ans !== null);
    if (allanswered) { this.showResults(); return; }
    const nextidx = (this.currentindex + 1) % totallen;
    if (this.useranswers[nextidx] === null) { this.currentindex = nextidx; this.renderQuestion(); return; }
    let searchidx = (this.currentindex - 1 + totallen) % totallen;
    while (searchidx !== this.currentindex) {
      if (this.useranswers[searchidx] === null) { this.currentindex = searchidx; this.renderQuestion(); return; }
      searchidx = (searchidx - 1 + totallen) % totallen;
    }
    this.currentindex = nextidx; this.renderQuestion();
  }
  showResults() {
    const allanswered = this.useranswers.every(ans => ans !== null);
    if (!allanswered) return;
    this.quizview.style.display = 'none';
    this.reportview.style.display = 'flex';
    this.statusbtn.disabled = false;
    this.statusbtn.classList.add('active');
    const score = this.useranswers.filter(ans => ans && ans.iscorrect).length;
    const totallen = this.questionslist.length;
    this.scoreval.textContent = `${score} / ${totallen}`;
    const nodes = this.sidebargrid.querySelectorAll('.node-button');
    nodes.forEach(n => n.classList.remove('active'));
  }
  shuffleQuestions() {
    const shuffled = [...this.originalorder];
    for (let idx = shuffled.length - 1; idx > 0; idx--) {
      const randidx = Math.floor(Math.random() * (idx + 1));
      [shuffled[idx], shuffled[randidx]] = [shuffled[randidx], shuffled[idx]];
    }
    this.loadQuestions(shuffled);
    this.initQuiz();
  }
  resetQuiz(keeporder) {
    if (keeporder) {
      const currentseq = this.questionslist.map(q => this.originalorder.find(o => o.question === q.question));
      this.loadQuestions(currentseq);
    } else {
      this.loadQuestions(this.originalorder);
    }
    this.initQuiz();
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const controller = new QuizManager(quizquestions);
  controller.initQuiz();
});
</script>
